<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 HS Code 2026</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <!-- شاشة التحميل -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loader-content">
            <div class="loader-icon">📚</div>
            <h2>HS Code 2026</h2>
            <div class="loader-bar"><div id="loaderProgress"></div></div>
            <p id="loaderText">جاري التحميل...</p>
        </div>
    </div>

    <div class="app">
        <!-- الهيدر -->
        <header class="header">
            <div class="logo">
                <span>📚</span>
                <div>
                    <h1>HS Code 2026</h1>
                    <small>دليل الرموز الجمركية</small>
                </div>
            </div>
            <button id="themeBtn" class="theme-btn">🌙</button>
        </header>

        <!-- البحث -->
        <div class="search-area">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="ابحث هنا... (كود، منتج، وصف)">
                <button id="clearBtn" class="clear-btn">✕</button>
            </div>
            <div id="searchStatus" class="search-status"></div>
        </div>

        <!-- المحتوى -->
        <div class="content">
            <!-- النتائج -->
            <aside id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <h3>📊 النتائج</h3>
                    <button id="sidebarToggle" class="sidebar-toggle">◀</button>
                </div>
                
                <div id="statsBar" class="stats-bar"></div>
                
                <div class="results-nav">
                    <button id="prevBtn">▲ السابق</button>
                    <span id="resultPos">-</span>
                    <button id="nextBtn">▼ التالي</button>
                </div>
                
                <div id="resultsList" class="results-list">
                    <div class="placeholder">
                        <span>🔍</span>
                        <p>اكتب للبحث</p>
                    </div>
                </div>
                
                <div class="history-box">
                    <h4>🕐 السابق</h4>
                    <div id="historyTags"></div>
                </div>
            </aside>

            <!-- عارض PDF -->
            <main class="viewer">
                <div class="viewer-toolbar">
                    <div class="tool-group">
                        <button id="pagePrev" class="tool-btn">◀</button>
                        <span class="page-num">
                            <input type="number" id="pageNum" value="1" min="1">
                            <span>/ <b id="pageTotal">0</b></span>
                        </span>
                        <button id="pageNext" class="tool-btn">▶</button>
                    </div>
                    
                    <input type="range" id="pageRange" class="page-range" min="1" value="1">
                    
                    <div class="tool-group">
                        <button id="zoomOut" class="tool-btn">➖</button>
                        <span id="zoomVal" class="zoom-val">100%</span>
                        <button id="zoomIn" class="tool-btn">➕</button>
                        <button id="zoomFit" class="tool-btn">⊡</button>
                    </div>
                </div>
                
                <div id="pdfContainer" class="pdf-container">
                    <canvas id="pdfCanvas"></canvas>
                    <div id="textLayer" class="text-layer"></div>
                </div>
            </main>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    
    <script src="script.js"></script>
</body>
</html>
