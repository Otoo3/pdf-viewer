<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 HS Code 2026 - دليل الرموز الجمركية</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1e1e2e;
            --surface3: #2a2a3e;
            --text: #f1f5f9;
            --text2: #94a3b8;
            --text3: #64748b;
            --border: #2e2e42;
            --highlight: #fbbf24;
            --highlight-bg: rgba(251, 191, 36, 0.2);
            --pinned-bg: rgba(34, 197, 94, 0.15);
            --pinned-border: #22c55e;
            --glow: rgba(99, 102, 241, 0.4);
            --shadow: rgba(0, 0, 0, 0.3);
            --pdf-bg: #1a1a1a;
            --panel-width: 420px;
        }
        
        [data-theme="light"] {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface2: #f1f5f9;
            --surface3: #e2e8f0;
            --text: #1e293b;
            --text2: #475569;
            --text3: #64748b;
            --border: #cbd5e1;
            --glow: rgba(99, 102, 241, 0.2);
            --shadow: rgba(0, 0, 0, 0.1);
            --pdf-bg: #e5e5e5;
            --pinned-bg: rgba(34, 197, 94, 0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: var(--bg); 
            color: var(--text);
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--surface2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-light); }
        * { scrollbar-width: thin; scrollbar-color: var(--primary) var(--surface2); }
        
        .app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: linear-gradient(180deg, var(--surface) 0%, var(--surface2) 100%);
            border-bottom: 1px solid var(--border);
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon { font-size: 2rem; filter: drop-shadow(0 0 10px var(--glow)); }
        .logo h1 {
            font-size: 1.3rem;
            background: linear-gradient(135deg, var(--primary-light), #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo p { font-size: 0.75rem; color: var(--text2); }
        
        .header-controls { display: flex; align-items: center; gap: 10px; }
        
        .theme-toggle {
            width: 56px; height: 28px;
            background: var(--surface3);
            border-radius: 14px;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5px;
            position: relative;
        }
        .theme-toggle:hover { border-color: var(--primary); }
        .theme-toggle-icon { font-size: 0.9rem; z-index: 1; transition: opacity 0.3s; }
        .theme-toggle .sun { opacity: 0.4; }
        .theme-toggle .moon { opacity: 1; }
        [data-theme="light"] .theme-toggle .sun { opacity: 1; }
        [data-theme="light"] .theme-toggle .moon { opacity: 0.4; }
        .theme-toggle-slider {
            position: absolute;
            width: 20px; height: 20px;
            background: var(--primary);
            border-radius: 50%;
            right: 4px;
            transition: all 0.3s;
        }
        [data-theme="light"] .theme-toggle-slider { right: calc(100% - 24px); }
        
        .toggle-panel-btn {
            padding: 8px 14px;
            background: var(--surface3);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }
        .toggle-panel-btn:hover { border-color: var(--primary); background: var(--primary); color: white; }
        
        .search-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
        }
        
        .search-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .search-input-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        
        #searchInput {
            width: 100%;
            padding: 12px 18px 12px 45px;
            background: var(--surface2);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
            direction: rtl;
            text-align: right;
        }
        #searchInput:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--glow); }
        #searchInput::placeholder { color: var(--text3); }
        
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: var(--text3);
            pointer-events: none;
        }
        
        #searchBtn {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        #searchBtn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px var(--glow); }
        
        .mini-nav {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--surface2);
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .mini-nav.hidden { display: none; }
        .mini-nav-count { font-size: 0.85rem; color: var(--text); font-weight: 600; min-width: 80px; text-align: center; }
        .mini-nav-count .highlight { color: var(--primary-light); }
        .mini-nav-btn {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .mini-nav-btn:hover:not(:disabled) { background: var(--primary); border-color: var(--primary); color: white; }
        .mini-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .search-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--surface2);
            border-radius: 10px;
            font-size: 0.8rem;
            color: var(--text2);
            white-space: nowrap;
        }
        .search-status.loading { color: var(--warning); }
        .search-status.ready { color: var(--success); }
        .search-status.hidden { display: none; }
        
        .spinner {
            width: 12px; height: 12px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .search-tips {
            width: 100%;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
            font-size: 0.75rem;
            color: var(--text3);
        }
        .search-tip {
            padding: 4px 10px;
            background: var(--surface2);
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: var(--panel-width) 1fr;
            overflow: hidden;
            transition: grid-template-columns 0.3s;
        }
        .main-content.panel-hidden { grid-template-columns: 0 1fr; }
        
        .results-panel {
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s;
        }
        .main-content.panel-hidden .results-panel { opacity: 0; pointer-events: none; }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .results-header h3 { font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
        #resultsCount { padding: 3px 8px; background: var(--primary); border-radius: 12px; font-size: 0.7rem; color: white; }
        
        .results-actions { display: flex; gap: 5px; align-items: center; }
        .action-btn {
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text2);
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .action-btn:hover { background: var(--primary); border-color: var(--primary); color: white; }
        
        .nav-controls {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 10px 15px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .nav-btn {
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        .nav-btn:hover:not(:disabled) { background: var(--primary); border-color: var(--primary); color: white; }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #resultPos { flex: 1; text-align: center; font-size: 0.8rem; color: var(--text2); padding: 0 8px; }
        
        .pinned-section {
            background: var(--pinned-bg);
            border-bottom: 2px solid var(--pinned-border);
            max-height: 180px;
            overflow-y: auto;
            display: none;
            flex-shrink: 0;
        }
        .pinned-section.has-items { display: block; }
        .pinned-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(34, 197, 94, 0.1);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--pinned-border);
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .clear-pinned {
            font-size: 0.7rem;
            padding: 3px 8px;
            background: var(--surface3);
            border: none;
            border-radius: 10px;
            color: var(--text2);
            cursor: pointer;
        }
        .clear-pinned:hover { background: var(--error); color: white; }
        #pinnedList { padding: 8px; }
        
        #resultsList {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 10px;
            scroll-behavior: smooth;
            min-height: 0;
        }
        #resultsList::-webkit-scrollbar { width: 10px; }
        #resultsList::-webkit-scrollbar-track { background: var(--bg); border-radius: 5px; margin: 5px 0; }
        #resultsList::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--primary), #8b5cf6); border-radius: 5px; border: 2px solid var(--bg); }
        
        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text3);
            text-align: center;
            padding: 20px;
        }
        .placeholder-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
        
        .result-card {
            background: var(--surface2);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .result-card:hover { border-color: var(--primary); transform: translateX(-3px); box-shadow: 3px 0 12px var(--glow); }
        .result-card.active { border-color: var(--primary); background: var(--highlight-bg); }
        .result-card.pinned { border-color: var(--pinned-border); background: var(--pinned-bg); }
        
        .result-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .page-badge {
            padding: 4px 10px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
        }
        .result-actions { display: flex; gap: 4px; }
        .result-action-btn {
            width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center;
            background: var(--surface3);
            border: none;
            border-radius: 5px;
            color: var(--text2);
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        .result-action-btn:hover { background: var(--primary); color: white; }
        .result-action-btn.copy-btn:hover { background: var(--info); }
        .result-action-btn.pin-btn:hover { background: var(--success); }
        .result-action-btn.delete-btn:hover { background: var(--error); }
        .result-action-btn.pinned { background: var(--success); color: white; }
        
        .result-text {
            font-size: 0.8rem;
            color: var(--text2);
            line-height: 1.6;
            padding: 8px;
            background: var(--bg);
            border-radius: 6px;
            max-height: 70px;
            overflow: hidden;
            user-select: text;
            direction: rtl;
        }
        .result-text .hl { background: var(--highlight); color: #000; padding: 1px 4px; border-radius: 3px; font-weight: 600; }
        
        .result-buttons { display: flex; gap: 6px; margin-top: 8px; }
        .go-btn {
            flex: 1;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px;
            background: var(--primary);
            border: none;
            border-radius: 6px;
            color: white;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .go-btn:hover { filter: brightness(1.15); }
        
        .copy-result-btn {
            padding: 8px 12px;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .copy-result-btn:hover { background: var(--info); border-color: var(--info); color: white; }
        
        .pdf-section { position: relative; background: var(--pdf-bg); overflow: hidden; }
        #pdf-container { width: 100%; height: 100%; }
        
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s, visibility 0.5s;
        }
        .loading-overlay.hidden { opacity: 0; visibility: hidden; }
        .loading-logo { font-size: 4.5rem; margin-bottom: 18px; animation: bounce 2s ease-in-out infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        .loading-overlay h2 {
            font-size: 1.8rem;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #c7d2fe, #e9d5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .loading-overlay p { color: rgba(255,255,255,0.7); font-size: 0.95rem; margin-bottom: 22px; }
        .loading-bar { width: 260px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; }
        .loading-fill {
            height: 100%;
            background: linear-gradient(90deg, #818cf8, #c084fc, #818cf8);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 3px;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        #loadingPercent { margin-top: 10px; font-size: 1rem; color: rgba(255,255,255,0.9); }
        
        #toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface2);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 10px;
            box-shadow: 0 10px 40px var(--shadow);
            opacity: 0;
            transition: all 0.3s;
            z-index: 9999;
            color: var(--text);
            font-size: 0.9rem;
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        #toast.success { border-color: var(--success); }
        #toast.error { border-color: var(--error); }
        #toast.warning { border-color: var(--warning); }
        #toast.info { border-color: var(--info); }
        
        @media (max-width: 1024px) {
            :root { --panel-width: 320px; }
            .main-content { grid-template-columns: 1fr; grid-template-rows: 1fr 45vh; }
            .main-content.panel-hidden { grid-template-rows: 1fr 0; }
            .results-panel { border-left: none; border-top: 1px solid var(--border); order: 2; }
            .pdf-section { order: 1; }
        }
        
        @media (max-width: 600px) {
            .header { padding: 8px 12px; }
            .logo h1 { font-size: 1.1rem; }
            .logo p { display: none; }
            .logo-icon { font-size: 1.6rem; }
            .search-bar { padding: 10px 12px; }
            .search-container { flex-direction: column; }
            #searchBtn { width: 100%; }
            .search-tips { display: none; }
            .toggle-panel-btn span:last-child { display: none; }
            .mini-nav { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body data-theme="dark">
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-logo">📚</div>
        <h2>HS Code 2026</h2>
        <p id="loadingText">جاري تحميل دليل الرموز الجمركية...</p>
        <div class="loading-bar">
            <div id="loadingFill" class="loading-fill" style="width: 0%"></div>
        </div>
        <div id="loadingPercent">0%</div>
    </div>

    <div class="app">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">📚</span>
                <div>
                    <h1>HS Code 2026</h1>
                    <p>دليل الرموز الجمركية - سلطنة عمان</p>
                </div>
            </div>
            
            <div class="header-controls">
                <button class="toggle-panel-btn" onclick="togglePanel()">
                    <span id="panelToggleIcon">◀</span>
                    <span>النتائج</span>
                </button>
                <div class="theme-toggle" onclick="toggleTheme()">
                    <span class="theme-toggle-icon sun">☀️</span>
                    <span class="theme-toggle-icon moon">🌙</span>
                    <div class="theme-toggle-slider"></div>
                </div>
            </div>
        </header>
        
        <div class="search-bar">
            <div class="search-container">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="ابحث عن كود جمركي أو منتج..." autocomplete="off">
                </div>
                <button id="searchBtn">🔎 بحث</button>
                
                <div id="miniNav" class="mini-nav hidden">
                    <button class="mini-nav-btn" id="miniPrevBtn" disabled onclick="navResult(-1)">◀</button>
                    <span class="mini-nav-count">
                        <span id="miniCurrentPos" class="highlight">0</span>/<span id="miniTotalResults">0</span>
                    </span>
                    <button class="mini-nav-btn" id="miniNextBtn" disabled onclick="navResult(1)">▶</button>
                </div>
                
                <div id="searchStatus" class="search-status loading">
                    <div class="spinner"></div>
                    <span>جاري التجهيز...</span>
                </div>
            </div>
            <div class="search-tips">
                <span class="search-tip">💡 يمكنك نسخ النص من PDF ولصقه مباشرة</span>
                <span class="search-tip">🔄 يتم إصلاح النص العربي تلقائياً</span>
            </div>
        </div>

        <div class="main-content" id="mainContent">
            <aside class="results-panel">
                <div class="results-header">
                    <h3>
                        <span>📊</span> النتائج
                        <span id="resultsCount" style="display:none">0</span>
                    </h3>
                    <div class="results-actions">
                        <button class="action-btn" onclick="clearAllResults()" title="مسح">🗑️</button>
                        <button class="action-btn" onclick="exportResults()" title="تصدير">📋</button>
                    </div>
                </div>
                
                <div class="nav-controls">
                    <button id="prevBtn" class="nav-btn" disabled>▲</button>
                    <span id="resultPos">-</span>
                    <button id="nextBtn" class="nav-btn" disabled>▼</button>
                </div>
                
                <div id="pinnedSection" class="pinned-section">
                    <div class="pinned-header">
                        <span>📌 المثبتة</span>
                        <button class="clear-pinned" onclick="clearPinned()">مسح</button>
                    </div>
                    <div id="pinnedList"></div>
                </div>
                
                <div id="resultsList">
                    <div class="placeholder">
                        <div class="placeholder-icon">🔍</div>
                        <p>ابحث عن كود أو منتج</p>
                    </div>
                </div>
            </aside>

            <main class="pdf-section">
                <div id="pdf-container"></div>
            </main>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        (function() {
            const s = document.createElement('script');
            s.src = 'https://acrobatservices.adobe.com/view-sdk/viewer.js';
            s.async = true;
            document.head.appendChild(s);
        })();
    </script>

    <script>
        // ========== إصلاح النص العربي ==========
        const ArabicFixer = {
            arabic: /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/,
            startWords: ['ال','من','في','على','إلى','عن','مع','أن','إن','كان','هذا','هذه','ذلك','تلك','التي','الذي','ما','لا','لم','لن','قد','غير','بعض','كل','رسوم','بند','سلع','مواد','أجهزة','آلات','معدات','قطع','أجزاء'],
            
            hasArabic(t) { return this.arabic.test(t); },
            
            reverse(s) { return s.split('').reverse().join(''); },
            
            isReversed(text) {
                if (!this.hasArabic(text)) return false;
                const words = text.trim().split(/\s+/).filter(w => this.hasArabic(w));
                if (!words.length) return false;
                
                const first = words[0], last = words[words.length - 1];
                
                // إذا الكلمة الأخيرة تبدأ بـ "ال" والأولى لا
                for (let sw of this.startWords) {
                    if (last.startsWith(sw) && !first.startsWith(sw)) return true;
                }
                
                // إذا الكلمة الأولى تنتهي بـ "لا" (ال معكوسة)
                if (first.endsWith('لا') && first.length > 3) return true;
                
                return false;
            },
            
            fix(text) {
                if (!text || !this.hasArabic(text) || !this.isReversed(text)) return text;
                
                // تقسيم لأجزاء
                const parts = [];
                let current = '', type = null;
                
                for (let c of text) {
                    let t = this.arabic.test(c) ? 'ar' : /\s/.test(c) ? 'sp' : 'other';
                    if (type === null || t === type || t === 'sp') {
                        current += c;
                        if (type === null || type === 'sp') type = t;
                    } else {
                        parts.push({type, text: current});
                        current = c;
                        type = t;
                    }
                }
                if (current) parts.push({type, text: current});
                
                // إصلاح الأجزاء العربية
                return parts.map(p => {
                    if (p.type !== 'ar') return p.text;
                    const words = p.text.split(/(\s+)/);
                    const fixed = words.map(w => /^\s+$/.test(w) ? w : this.hasArabic(w) ? this.reverse(w) : w);
                    const nonSpace = [];
                    fixed.forEach((w,i) => { if (!/^\s+$/.test(w)) nonSpace.push(i); });
                    const reversed = nonSpace.map(i => fixed[i]).reverse();
                    nonSpace.forEach((idx,i) => { fixed[idx] = reversed[i]; });
                    return fixed.join('');
                }).join('');
            },
            
            normalize(text) {
                const ar = '٠١٢٣٤٥٦٧٨٩', en = '0123456789';
                let r = text;
                for (let i = 0; i < 10; i++) r = r.replace(new RegExp(ar[i], 'g'), en[i]);
                return r;
            }
        };

        // ========== الإعدادات ==========
        const CONFIG = {
            ADOBE_CLIENT_ID: '5edf16250afa446aa490af6313d351b2',
            PDF_FILE: 'HS Code 2026.pdf',
            SEARCH_DELAY: 300,
            MIN_SEARCH_LENGTH: 2
        };
        
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // ========== الحالة ==========
        let adobeViewer = null, pdfText = [], results = [], pinnedResults = [];
        let resultIdx = -1, totalPages = 0, indexed = false, currentSearchTerm = '', panelVisible = true;

        // ========== الثيم ==========
        function initTheme() {
            const saved = localStorage.getItem('hs-code-theme');
            if (saved) document.body.setAttribute('data-theme', saved);
        }
        
        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('hs-code-theme', newTheme);
        }
        
        initTheme();

        function togglePanel() {
            panelVisible = !panelVisible;
            document.getElementById('mainContent').classList.toggle('panel-hidden', !panelVisible);
            document.getElementById('panelToggleIcon').textContent = panelVisible ? '◀' : '▶';
        }

        // ========== التهيئة ==========
        document.addEventListener('adobe_dc_view_sdk.ready', initApp);
        setTimeout(() => { if (!window.AdobeDC) indexPDFForSearch(); }, 5000);

        async function initApp() {
            setupEvents();
            await Promise.all([initAdobeViewer(), indexPDFForSearch()]);
        }

        function setupEvents() {
            const searchInput = document.getElementById('searchInput');
            
            // ★ اللصق مع الإصلاح التلقائي ★
            searchInput.addEventListener('paste', function(e) {
                e.preventDefault();
                const pasted = (e.clipboardData || window.clipboardData).getData('text');
                
                // إصلاح وتطبيع
                let fixed = ArabicFixer.fix(pasted);
                fixed = ArabicFixer.normalize(fixed);
                
                // إدراج النص
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + fixed + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + fixed.length;
                
                // بحث تلقائي
                if (fixed.length >= CONFIG.MIN_SEARCH_LENGTH) {
                    setTimeout(doSearch, 150);
                }
            });
            
            // البحث أثناء الكتابة
            let timer;
            searchInput.addEventListener('input', function() {
                clearTimeout(timer);
                if (this.value.length >= CONFIG.MIN_SEARCH_LENGTH) {
                    timer = setTimeout(doSearch, CONFIG.SEARCH_DELAY);
                } else if (this.value.length === 0) {
                    clearSearchResults();
                }
            });
            
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { clearTimeout(timer); doSearch(); }
                if (e.key === 'ArrowDown' && results.length) { e.preventDefault(); navResult(1); }
                if (e.key === 'ArrowUp' && results.length) { e.preventDefault(); navResult(-1); }
            });
            
            document.getElementById('searchBtn').addEventListener('click', doSearch);
            document.getElementById('prevBtn').addEventListener('click', () => navResult(-1));
            document.getElementById('nextBtn').addEventListener('click', () => navResult(1));
            
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT') return;
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') { e.preventDefault(); searchInput.focus(); searchInput.select(); }
                if (e.key === 'ArrowUp') { e.preventDefault(); navResult(-1); }
                if (e.key === 'ArrowDown') { e.preventDefault(); navResult(1); }
            });
            
            loadPinnedResults();
        }

        // ========== Adobe Viewer ==========
        async function initAdobeViewer() {
            if (!window.AdobeDC) return;
            updateLoading('جاري تحميل العارض...', 20);
            
            try {
                const view = new AdobeDC.View({ clientId: CONFIG.ADOBE_CLIENT_ID, divId: 'pdf-container' });
                adobeViewer = await view.previewFile(
                    { content: { location: { url: CONFIG.PDF_FILE } }, metaData: { fileName: CONFIG.PDF_FILE } },
                    { embedMode: 'FULL_WINDOW', defaultViewMode: 'FIT_WIDTH', showAnnotationTools: false, showLeftHandPanel: false, showPageControls: true, showDownloadPDF: true, showPrintPDF: false }
                );
                window.pdfAPIs = await adobeViewer.getAPIs();
            } catch (e) {}
        }

        // ========== فهرسة PDF ==========
        async function indexPDFForSearch() {
            updateLoading('جاري فهرسة الملف...', 30);
            
            try {
                const pdf = await pdfjsLib.getDocument({
                    url: CONFIG.PDF_FILE,
                    cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                    cMapPacked: true
                }).promise;
                
                totalPages = pdf.numPages;
                pdfText = new Array(totalPages);
                
                for (let i = 0; i < totalPages; i += 10) {
                    const batch = [];
                    for (let j = i; j < Math.min(i + 10, totalPages); j++) batch.push(indexPage(pdf, j + 1));
                    await Promise.all(batch);
                    updateLoading(`فهرسة... ${Math.min(i + 10, totalPages)}/${totalPages}`, 50 + (i / totalPages) * 45);
                }
                
                indexed = true;
                updateLoading('جاهز!', 100);
                
                const status = document.getElementById('searchStatus');
                status.className = 'search-status ready';
                status.innerHTML = `<span>✅</span><span>جاهز (${totalPages} صفحة)</span>`;
                
                setTimeout(() => {
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    setTimeout(() => status.classList.add('hidden'), 2000);
                }, 800);
            } catch (e) {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }
        
        async function indexPage(pdf, num) {
            try {
                const page = await pdf.getPage(num);
                const content = await page.getTextContent();
                pdfText[num - 1] = { page: num, text: content.items.map(i => i.str).join(' ') };
            } catch (e) {
                pdfText[num - 1] = { page: num, text: '' };
            }
        }

        function updateLoading(text, percent) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingPercent').textContent = percent + '%';
            document.getElementById('loadingFill').style.width = percent + '%';
        }

        // ========== البحث ==========
        function doSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query || query.length < CONFIG.MIN_SEARCH_LENGTH || !indexed) return;
            
            currentSearchTerm = query;
            results = [];
            
            const qLower = query.toLowerCase();
            const qNoSpace = query.replace(/\s/g, '').toLowerCase();
            
            pdfText.forEach(p => {
                if (!p || !p.text) return;
                const tLower = p.text.toLowerCase();
                const tNoSpace = p.text.replace(/\s/g, '').toLowerCase();
                
                if (tLower.includes(qLower) || tNoSpace.includes(qNoSpace)) {
                    const i = tLower.indexOf(qLower);
                    const start = Math.max(0, i - 40);
                    const end = Math.min(p.text.length, i + query.length + 60);
                    let ctx = p.text.substring(start, end).trim();
                    if (start > 0) ctx = '...' + ctx;
                    if (end < p.text.length) ctx += '...';
                    results.push({ page: p.page, ctx, searchTerm: query });
                }
            });
            
            showResults(query);
            updateMiniNav();
            
            if (results.length > 0) {
                resultIdx = 0;
                gotoResult(0);
                showToast(`✅ ${results.length} نتيجة`, 'success');
            } else {
                showToast(`لا توجد نتائج`, 'warning');
            }
        }
        
        function clearSearchResults() {
            results = []; resultIdx = -1;
            document.getElementById('resultsCount').style.display = 'none';
            document.getElementById('resultPos').textContent = '-';
            document.getElementById('prevBtn').disabled = true;
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('resultsList').innerHTML = `<div class="placeholder"><div class="placeholder-icon">🔍</div><p>ابحث عن كود أو منتج</p></div>`;
            updateMiniNav();
        }
        
        function clearAllResults() {
            clearSearchResults();
            document.getElementById('searchInput').value = '';
        }
        
        function updateMiniNav() {
            const nav = document.getElementById('miniNav');
            if (!results.length) { nav.classList.add('hidden'); return; }
            nav.classList.remove('hidden');
            document.getElementById('miniCurrentPos').textContent = resultIdx + 1;
            document.getElementById('miniTotalResults').textContent = results.length;
            document.getElementById('miniPrevBtn').disabled = resultIdx <= 0;
            document.getElementById('miniNextBtn').disabled = resultIdx >= results.length - 1;
        }

        function showResults(query) {
            const list = document.getElementById('resultsList');
            const count = document.getElementById('resultsCount');
            
            if (!results.length) {
                count.style.display = 'none';
                list.innerHTML = `<div class="placeholder"><div class="placeholder-icon">😕</div><p>لا توجد نتائج</p></div>`;
                return;
            }
            
            count.textContent = results.length;
            count.style.display = 'inline';
            document.getElementById('resultPos').textContent = `1/${results.length}`;
            document.getElementById('prevBtn').disabled = true;
            document.getElementById('nextBtn').disabled = results.length <= 1;
            
            const esc = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${esc})`, 'gi');
            
            list.innerHTML = results.map((r, i) => {
                const pinned = pinnedResults.some(p => p.page === r.page);
                return `
                <div class="result-card ${i === 0 ? 'active' : ''} ${pinned ? 'pinned' : ''}" onclick="gotoResult(${i})">
                    <div class="result-top">
                        <span class="page-badge">📄 صفحة ${r.page}</span>
                        <div class="result-actions">
                            <button class="result-action-btn copy-btn" onclick="event.stopPropagation();copyResult(${i})">📋</button>
                            <button class="result-action-btn pin-btn ${pinned ? 'pinned' : ''}" onclick="event.stopPropagation();togglePin(${i})">📌</button>
                            <button class="result-action-btn delete-btn" onclick="event.stopPropagation();deleteResult(${i})">✕</button>
                        </div>
                    </div>
                    <div class="result-text">${r.ctx.replace(regex, '<span class="hl">$1</span>')}</div>
                    <div class="result-buttons">
                        <button class="go-btn" onclick="event.stopPropagation();gotoResult(${i})">← انتقال</button>
                        <button class="copy-result-btn" onclick="event.stopPropagation();copyResult(${i})">📋 نسخ</button>
                    </div>
                </div>`;
            }).join('');
        }

        function copyResult(i) {
            if (i < 0 || i >= results.length) return;
            const r = results[i];
            navigator.clipboard.writeText(`صفحة ${r.page}: ${r.ctx.replace(/\.\.\./g, '')}`);
            showToast('📋 تم النسخ', 'success');
        }

        async function gotoResult(i) {
            if (i < 0 || i >= results.length) return;
            resultIdx = i;
            
            document.querySelectorAll('.result-card').forEach((c, j) => c.classList.toggle('active', j === i));
            document.getElementById('resultPos').textContent = `${i + 1}/${results.length}`;
            document.getElementById('prevBtn').disabled = i === 0;
            document.getElementById('nextBtn').disabled = i === results.length - 1;
            updateMiniNav();
            
            if (window.pdfAPIs) await window.pdfAPIs.gotoLocation(results[i].page);
            
            const card = document.querySelector('.result-card.active');
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function navResult(dir) {
            const n = resultIdx + dir;
            if (n >= 0 && n < results.length) gotoResult(n);
        }
        
        function togglePin(i) {
            const r = results[i];
            const idx = pinnedResults.findIndex(p => p.page === r.page);
            if (idx >= 0) pinnedResults.splice(idx, 1);
            else pinnedResults.push({...r});
            savePinnedResults();
            updatePinnedSection();
            showResults(currentSearchTerm);
        }
        
        function deleteResult(i) {
            results.splice(i, 1);
            if (!results.length) clearSearchResults();
            else {
                if (resultIdx >= results.length) resultIdx = results.length - 1;
                showResults(currentSearchTerm);
                updateMiniNav();
            }
        }
        
        function clearPinned() {
            pinnedResults = [];
            savePinnedResults();
            updatePinnedSection();
            showResults(currentSearchTerm);
        }
        
        function updatePinnedSection() {
            const sec = document.getElementById('pinnedSection');
            const list = document.getElementById('pinnedList');
            if (!pinnedResults.length) { sec.classList.remove('has-items'); return; }
            sec.classList.add('has-items');
            list.innerHTML = pinnedResults.map((r, i) => `
                <div class="result-card pinned" onclick="gotoPinnedResult(${i})" style="margin-bottom:6px;padding:10px;">
                    <div class="result-top">
                        <span class="page-badge">📄 ${r.page}</span>
                        <button class="result-action-btn delete-btn" onclick="event.stopPropagation();removePinned(${i})">✕</button>
                    </div>
                </div>
            `).join('');
        }
        
        function removePinned(i) {
            pinnedResults.splice(i, 1);
            savePinnedResults();
            updatePinnedSection();
            showResults(currentSearchTerm);
        }
        
        async function gotoPinnedResult(i) {
            if (window.pdfAPIs) await window.pdfAPIs.gotoLocation(pinnedResults[i].page);
        }
        
        function savePinnedResults() { localStorage.setItem('hs-code-pinned', JSON.stringify(pinnedResults)); }
        
        function loadPinnedResults() {
            try {
                const saved = localStorage.getItem('hs-code-pinned');
                if (saved) { pinnedResults = JSON.parse(saved); updatePinnedSection(); }
            } catch (e) { pinnedResults = []; }
        }
        
        function exportResults() {
            if (!results.length) return;
            let text = `نتائج البحث - HS Code 2026\n${'='.repeat(40)}\n\n`;
            results.forEach((r, i) => { text += `${i+1}. صفحة ${r.page}\n   ${r.ctx}\n\n`; });
            navigator.clipboard.writeText(text);
            showToast('📋 تم نسخ النتائج', 'success');
        }

        function showToast(msg, type = 'info') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `show ${type}`;
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => t.className = '', 2500);
        }

        window.gotoResult = gotoResult;
        window.gotoPinnedResult = gotoPinnedResult;
        window.toggleTheme = toggleTheme;
        window.togglePanel = togglePanel;
        window.togglePin = togglePin;
        window.deleteResult = deleteResult;
        window.clearPinned = clearPinned;
        window.clearAllResults = clearAllResults;
        window.exportResults = exportResults;
        window.navResult = navResult;
        window.copyResult = copyResult;
        window.removePinned = removePinned;
    </script>
</body>
</html>
