<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 HS Code 2026</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div class="app">
        <!-- الهيدر -->
        <header class="header">
            <div class="logo">
                <span>📚</span>
                <div>
                    <h1>HS Code 2026</h1>
                    <small>دليل الرموز الجمركية</small>
                </div>
            </div>
            <button id="themeBtn" class="theme-btn">🌙</button>
        </header>

        <!-- البحث -->
        <div class="search-area">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="ابحث هنا... (كود، منتج، وصف)">
                <button id="clearBtn" class="clear-btn">✕</button>
            </div>
            <div id="searchStatus" class="search-status">جاري تجهيز البحث...</div>
        </div>

        <!-- المحتوى -->
        <div class="content">
            <!-- النتائج -->
            <aside id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <h3>📊 النتائج</h3>
                    <button id="sidebarToggle" class="sidebar-toggle">◀</button>
                </div>
                
                <div id="statsBar" class="stats-bar"></div>
                
                <div class="results-nav">
                    <button id="prevBtn" disabled>▲ السابق</button>
                    <span id="resultPos">-</span>
                    <button id="nextBtn" disabled>▼ التالي</button>
                </div>
                
                <div id="resultsList" class="results-list">
                    <div class="placeholder">
                        <span>🔍</span>
                        <p>اكتب للبحث</p>
                    </div>
                </div>
                
                <div class="history-box">
                    <h4>🕐 السابق</h4>
                    <div id="historyTags"></div>
                </div>
            </aside>

            <!-- عارض PDF -->
            <main class="viewer">
                <div class="viewer-toolbar">
                    <span id="pageInfo" class="page-info">صفحة 1</span>
                    <a id="downloadBtn" class="download-btn" href="#" target="_blank">💾 تحميل</a>
                </div>
                
                <div class="pdf-frame-wrapper">
                    <iframe id="pdfFrame" src="" allowfullscreen></iframe>
                </div>
            </main>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    
    <script src="script.js"></script>
</body>
</html>
