<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 HS Code 2026 - دليل الرموز الجمركية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #22c55e;
            --warning: #f59e0b;
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1e1e2e;
            --surface3: #2a2a3e;
            --text: #f1f5f9;
            --text2: #94a3b8;
            --border: #2e2e42;
            --highlight: #fbbf24;
            --glow: rgba(99, 102, 241, 0.4);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: var(--bg); 
            color: var(--text);
            overflow: hidden;
        }
        
        .app {
            display: grid;
            grid-template-columns: 400px 1fr;
            grid-template-rows: auto 1fr;
            height: 100vh;
        }
        
        /* Header */
        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            background: linear-gradient(180deg, var(--surface) 0%, var(--surface2) 100%);
            border-bottom: 1px solid var(--border);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px var(--glow));
        }
        
        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .logo p {
            font-size: 0.85rem;
            color: var(--text2);
        }
        
        /* Search Panel */
        .search-panel {
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .search-header {
            padding: 20px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
        }
        
        .search-box {
            display: flex;
            gap: 10px;
        }
        
        .search-input-wrapper {
            flex: 1;
            position: relative;
        }
        
        #searchInput {
            width: 100%;
            padding: 14px 20px 14px 45px;
            background: var(--surface3);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }
        
        #searchInput:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--glow);
        }
        
        #searchInput::placeholder {
            color: var(--text2);
        }
        
        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: var(--text2);
        }
        
        #searchBtn {
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        #searchBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--glow);
        }
        
        /* Status */
        #searchStatus {
            margin-top: 12px;
            padding: 10px 15px;
            background: var(--surface3);
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #searchStatus.loading { color: var(--warning); }
        #searchStatus.ready { color: var(--success); }
        #searchStatus.hidden { display: none; }
        
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Results */
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
        }
        
        .results-header h3 {
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        #resultsCount {
            padding: 4px 12px;
            background: var(--primary);
            border-radius: 20px;
            font-size: 0.8rem;
        }
        
        .nav-buttons {
            display: flex;
            gap: 8px;
        }
        
        .nav-btn {
            padding: 8px 16px;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        .nav-btn:hover:not(:disabled) {
            background: var(--primary);
            border-color: var(--primary);
        }
        
        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        #resultPos {
            padding: 8px 12px;
            background: var(--bg);
            border-radius: 8px;
            font-size: 0.85rem;
            min-width: 70px;
            text-align: center;
        }
        
        /* Results List */
        #resultsList {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text2);
            text-align: center;
        }
        
        .placeholder-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        .result-card {
            background: var(--surface2);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .result-card:hover {
            border-color: var(--primary);
            transform: translateX(-5px);
            box-shadow: 5px 0 20px var(--glow);
        }
        
        .result-card.active {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }
        
        .result-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .page-badge {
            padding: 6px 14px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .match-count {
            font-size: 0.8rem;
            color: var(--text2);
        }
        
        .result-text {
            font-size: 0.9rem;
            color: var(--text2);
            line-height: 1.8;
            padding: 12px;
            background: var(--bg);
            border-radius: 10px;
            max-height: 80px;
            overflow: hidden;
        }
        
        .result-text .hl {
            background: var(--highlight);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        
        .go-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .go-btn:hover {
            filter: brightness(1.15);
        }
        
        /* PDF Viewer Section */
        .pdf-section {
            position: relative;
            background: #1a1a1a;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* PDF Toolbar */
        .pdf-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .toolbar-btn {
            padding: 8px 14px;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .toolbar-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }
        
        .toolbar-btn.active {
            background: var(--primary);
            border-color: var(--primary);
        }
        
        .page-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text2);
            font-size: 0.9rem;
        }
        
        #pageInput {
            width: 60px;
            padding: 6px 10px;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            text-align: center;
            font-family: inherit;
        }
        
        #zoomSelect {
            padding: 6px 10px;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: inherit;
            cursor: pointer;
        }
        
        /* PDF Container */
        #pdf-container {
            flex: 1;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 20px;
        }
        
        .page-wrapper {
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            background: white;
        }
        
        .page-wrapper canvas {
            display: block;
        }
        
        /* Text Layer - للتحديد والنسخ */
        .text-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            opacity: 0.2;
            line-height: 1.0;
            pointer-events: auto;
        }
        
        .text-layer > span {
            color: transparent;
            position: absolute;
            white-space: pre;
            cursor: text;
            transform-origin: 0% 0%;
            direction: rtl;
            unicode-bidi: bidi-override;
        }
        
        .text-layer > span::selection {
            background: rgba(99, 102, 241, 0.4);
        }
        
        .text-layer > span::-moz-selection {
            background: rgba(99, 102, 241, 0.4);
        }
        
        /* Highlight Layer - لتمييز نتائج البحث */
        .highlight-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }
        
        .search-highlight {
            position: absolute;
            background: rgba(251, 191, 36, 0.4);
            border: 2px solid #f59e0b;
            border-radius: 3px;
            mix-blend-mode: multiply;
        }
        
        /* Copy Toast */
        .copy-notification {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .copy-notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        /* Loading */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: all 0.5s;
        }
        
        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .loading-logo {
            font-size: 6rem;
            margin-bottom: 25px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .loading-overlay h2 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #c7d2fe, #e9d5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .loading-overlay p {
            color: rgba(255,255,255,0.7);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        
        .loading-bar {
            width: 320px;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .loading-fill {
            height: 100%;
            background: linear-gradient(90deg, #818cf8, #c084fc, #818cf8);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 3px;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        #loadingPercent {
            margin-top: 15px;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
        }
        
        /* Toast */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface2);
            border: 1px solid var(--border);
            padding: 15px 30px;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            opacity: 0;
            transition: all 0.3s;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        #toast.success { border-color: var(--success); }
        
        /* Context Menu */
        .context-menu {
            position: fixed;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 0;
            min-width: 180px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 10001;
            display: none;
        }
        
        .context-menu.show {
            display: block;
        }
        
        .context-menu-item {
            padding: 10px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }
        
        .context-menu-item:hover {
            background: var(--primary);
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }
            
            .search-panel {
                max-height: 45vh;
                border-left: none;
                border-bottom: 1px solid var(--border);
            }
        }
        
        @media (max-width: 600px) {
            .logo h1 { font-size: 1.2rem; }
            .logo p { display: none; }
            .search-box { flex-direction: column; }
            #searchBtn { width: 100%; }
            .pdf-toolbar { padding: 8px 10px; }
            .toolbar-btn span:not(.icon) { display: none; }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-logo">📚</div>
        <h2>HS Code 2026</h2>
        <p id="loadingText">جاري تحميل دليل الرموز الجمركية...</p>
        <div class="loading-bar">
            <div id="loadingFill" class="loading-fill" style="width: 0%"></div>
        </div>
        <div id="loadingPercent">0%</div>
    </div>

    <!-- Main App -->
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">📚</span>
                <div>
                    <h1>HS Code 2026</h1>
                    <p>دليل الرموز الجمركية - سلطنة عمان</p>
                </div>
            </div>
        </header>

        <!-- Search Panel -->
        <aside class="search-panel">
            <div class="search-header">
                <div class="search-box">
                    <div class="search-input-wrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" placeholder="ابحث عن كود أو منتج...">
                    </div>
                    <button id="searchBtn">بحث</button>
                </div>
                <div id="searchStatus" class="loading">
                    <div class="spinner"></div>
                    <span>جاري تجهيز البحث...</span>
                </div>
            </div>
            
            <div class="results-header">
                <h3>
                    <span>📊</span>
                    النتائج
                    <span id="resultsCount" style="display:none">0</span>
                </h3>
                <div class="nav-buttons">
                    <button id="prevBtn" class="nav-btn" disabled>▲</button>
                    <span id="resultPos">-</span>
                    <button id="nextBtn" class="nav-btn" disabled>▼</button>
                </div>
            </div>
            
            <div id="resultsList">
                <div class="placeholder">
                    <div class="placeholder-icon">🔍</div>
                    <p>اكتب في مربع البحث أعلاه<br>للعثور على الأكواد والمنتجات</p>
                </div>
            </div>
        </aside>

        <!-- PDF Viewer -->
        <main class="pdf-section">
            <!-- PDF Toolbar -->
            <div class="pdf-toolbar">
                <div class="toolbar-group">
                    <button class="toolbar-btn" id="prevPage" title="الصفحة السابقة">
                        <span class="icon">◀</span>
                        <span>السابق</span>
                    </button>
                    <div class="page-info">
                        <input type="number" id="pageInput" value="1" min="1">
                        <span>من</span>
                        <span id="totalPages">-</span>
                    </div>
                    <button class="toolbar-btn" id="nextPage" title="الصفحة التالية">
                        <span>التالي</span>
                        <span class="icon">▶</span>
                    </button>
                </div>
                
                <div class="toolbar-group">
                    <button class="toolbar-btn" id="zoomOut" title="تصغير">➖</button>
                    <select id="zoomSelect">
                        <option value="0.5">50%</option>
                        <option value="0.75">75%</option>
                        <option value="1" selected>100%</option>
                        <option value="1.25">125%</option>
                        <option value="1.5">150%</option>
                        <option value="2">200%</option>
                        <option value="fit">ملائمة العرض</option>
                    </select>
                    <button class="toolbar-btn" id="zoomIn" title="تكبير">➕</button>
                </div>
                
                <div class="toolbar-group">
                    <button class="toolbar-btn" id="selectMode" title="وضع التحديد">
                        <span class="icon">✋</span>
                        <span>تحديد النص</span>
                    </button>
                    <button class="toolbar-btn" id="copySelected" title="نسخ المحدد">
                        <span class="icon">📋</span>
                        <span>نسخ</span>
                    </button>
                    <button class="toolbar-btn" id="downloadPdf" title="تحميل">
                        <span class="icon">💾</span>
                        <span>تحميل</span>
                    </button>
                </div>
            </div>
            
            <!-- PDF Container -->
            <div id="pdf-container"></div>
        </main>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu" class="context-menu">
        <div class="context-menu-item" id="copyMenuItem">
            <span>📋</span>
            <span>نسخ النص</span>
        </div>
        <div class="context-menu-item" id="copyFixedMenuItem">
            <span>🔄</span>
            <span>نسخ (تصحيح الاتجاه)</span>
        </div>
    </div>

    <!-- Copy Notification -->
    <div id="copyNotification" class="copy-notification">
        <span>✅</span>
        <span>تم نسخ النص بنجاح!</span>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <script>
        // ========== Configuration ==========
        const CONFIG = {
            PDF_FILE: 'HS Code 2026.pdf'
        };
        
        pdfjsLib.GlobalWorkerOptions.workerSrc = 
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // ========== State ==========
        let pdfDoc = null;
        let pdfText = [];
        let results = [];
        let resultIdx = -1;
        let currentPage = 1;
        let totalPagesCount = 0;
        let scale = 1;
        let indexed = false;
        let isSelectMode = true;
        let renderedPages = new Map();

        // ========== Initialize ==========
        document.addEventListener('DOMContentLoaded', initApp);

        async function initApp() {
            setupEvents();
            await loadPDF();
        }

        function setupEvents() {
            // Search events
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            
            searchInput.addEventListener('input', function() {
                clearTimeout(window.searchTimer);
                if (this.value.length >= 2) {
                    window.searchTimer = setTimeout(doSearch, 400);
                }
            });
            
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') doSearch();
            });
            
            searchBtn.addEventListener('click', doSearch);
            document.getElementById('prevBtn').addEventListener('click', () => navResult(-1));
            document.getElementById('nextBtn').addEventListener('click', () => navResult(1));
            
            // PDF navigation
            document.getElementById('prevPage').addEventListener('click', () => goToPage(currentPage - 1));
            document.getElementById('nextPage').addEventListener('click', () => goToPage(currentPage + 1));
            document.getElementById('pageInput').addEventListener('change', (e) => goToPage(parseInt(e.target.value)));
            
            // Zoom controls
            document.getElementById('zoomIn').addEventListener('click', () => changeZoom(0.25));
            document.getElementById('zoomOut').addEventListener('click', () => changeZoom(-0.25));
            document.getElementById('zoomSelect').addEventListener('change', handleZoomSelect);
            
            // Select mode
            document.getElementById('selectMode').addEventListener('click', toggleSelectMode);
            document.getElementById('copySelected').addEventListener('click', copySelectedText);
            document.getElementById('downloadPdf').addEventListener('click', downloadPDF);
            
            // Context menu
            document.addEventListener('contextmenu', handleContextMenu);
            document.addEventListener('click', hideContextMenu);
            document.getElementById('copyMenuItem').addEventListener('click', () => copyText(false));
            document.getElementById('copyFixedMenuItem').addEventListener('click', () => copyText(true));
            
            // Keyboard shortcuts
            document.addEventListener('keydown', handleKeyboard);
            
            // Copy event handler for fixing Arabic text
            document.addEventListener('copy', handleCopy);
        }

        // ========== PDF Loading ==========
        async function loadPDF() {
            updateLoading('جاري تحميل الملف...', 10);
            
            try {
                pdfDoc = await pdfjsLib.getDocument({
                    url: CONFIG.PDF_FILE,
                    cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                    cMapPacked: true
                }).promise;
                
                totalPagesCount = pdfDoc.numPages;
                document.getElementById('totalPages').textContent = totalPagesCount;
                document.getElementById('pageInput').max = totalPagesCount;
                
                updateLoading('جاري فهرسة الملف للبحث...', 30);
                
                // Index all pages for search
                await indexAllPages();
                
                // Render first page
                await renderPage(1);
                
                // Mark as ready
                indexed = true;
                updateLoading('جاهز!', 100);
                
                const status = document.getElementById('searchStatus');
                status.className = 'ready';
                status.innerHTML = `<span>✅</span><span>جاهز للبحث (${totalPagesCount} صفحة)</span>`;
                
                setTimeout(() => {
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    status.classList.add('hidden');
                }, 800);
                
            } catch (error) {
                console.error('Error loading PDF:', error);
                showToast('❌ خطأ في تحميل الملف', 'error');
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }

        async function indexAllPages() {
            pdfText = [];
            
            for (let i = 1; i <= totalPagesCount; i++) {
                const percent = 30 + Math.round((i / totalPagesCount) * 50);
                updateLoading(`فهرسة الصفحة ${i} من ${totalPagesCount}...`, percent);
                
                try {
                    const page = await pdfDoc.getPage(i);
                    const content = await page.getTextContent();
                    const text = content.items.map(item => item.str).join(' ');
                    pdfText.push({ page: i, text: text, items: content.items });
                } catch (e) {
                    pdfText.push({ page: i, text: '', items: [] });
                }
            }
        }

        // ========== Page Rendering ==========
        async function renderPage(pageNum) {
            if (pageNum < 1 || pageNum > totalPagesCount) return;
            
            currentPage = pageNum;
            document.getElementById('pageInput').value = pageNum;
            
            const container = document.getElementById('pdf-container');
            container.innerHTML = '';
            
            // Calculate scale for "fit width"
            if (scale === 'fit') {
                const page = await pdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1 });
                scale = (container.clientWidth - 40) / viewport.width;
            }
            
            // Render visible pages (current + buffer)
            const pagesToRender = [pageNum];
            if (pageNum > 1) pagesToRender.unshift(pageNum - 1);
            if (pageNum < totalPagesCount) pagesToRender.push(pageNum + 1);
            
            for (const pNum of pagesToRender) {
                await renderSinglePage(pNum, container, pNum === pageNum);
            }
            
            // Scroll to current page
            const currentPageEl = container.querySelector(`[data-page="${pageNum}"]`);
            if (currentPageEl) {
                currentPageEl.scrollIntoView({ behavior: 'auto', block: 'start' });
            }
        }

        async function renderSinglePage(pageNum, container, isCurrent) {
            const page = await pdfDoc.getPage(pageNum);
            const currentScale = typeof scale === 'number' ? scale : 1;
            const viewport = page.getViewport({ scale: currentScale });
            
            // Create wrapper
            const wrapper = document.createElement('div');
            wrapper.className = 'page-wrapper';
            wrapper.dataset.page = pageNum;
            wrapper.style.width = viewport.width + 'px';
            wrapper.style.height = viewport.height + 'px';
            
            // Create canvas
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            wrapper.appendChild(canvas);
            
            // Create text layer for selection
            const textLayer = document.createElement('div');
            textLayer.className = 'text-layer';
            textLayer.style.width = viewport.width + 'px';
            textLayer.style.height = viewport.height + 'px';
            wrapper.appendChild(textLayer);
            
            // Create highlight layer
            const highlightLayer = document.createElement('div');
            highlightLayer.className = 'highlight-layer';
            wrapper.appendChild(highlightLayer);
            
            container.appendChild(wrapper);
            
            // Render page
            await page.render({
                canvasContext: ctx,
                viewport: viewport
            }).promise;
            
            // Render text layer
            const textContent = await page.getTextContent();
            await renderTextLayer(textLayer, textContent, viewport);
            
            renderedPages.set(pageNum, { wrapper, textLayer, highlightLayer, viewport });
        }

        async function renderTextLayer(textLayerDiv, textContent, viewport) {
            textLayerDiv.innerHTML = '';
            
            const textItems = textContent.items;
            
            for (const item of textItems) {
                if (!item.str || item.str.trim() === '') continue;
                
                const tx = pdfjsLib.Util.transform(
                    viewport.transform,
                    item.transform
                );
                
                const span = document.createElement('span');
                span.textContent = item.str;
                span.dir = 'rtl';
                
                // Position and style
                const fontSize = Math.sqrt((tx[0] * tx[0]) + (tx[1] * tx[1]));
                const angle = Math.atan2(tx[1], tx[0]);
                
                span.style.left = tx[4] + 'px';
                span.style.top = (tx[5] - fontSize) + 'px';
                span.style.fontSize = fontSize + 'px';
                span.style.fontFamily = item.fontName ? item.fontName : 'sans-serif';
                
                if (angle !== 0) {
                    span.style.transform = `rotate(${angle}rad)`;
                }
                
                textLayerDiv.appendChild(span);
            }
        }

        // ========== Navigation ==========
        async function goToPage(pageNum) {
            if (pageNum < 1) pageNum = 1;
            if (pageNum > totalPagesCount) pageNum = totalPagesCount;
            await renderPage(pageNum);
        }

        // ========== Zoom ==========
        function changeZoom(delta) {
            const currentScale = typeof scale === 'number' ? scale : 1;
            scale = Math.max(0.25, Math.min(4, currentScale + delta));
            document.getElementById('zoomSelect').value = scale;
            renderPage(currentPage);
        }

        function handleZoomSelect(e) {
            const value = e.target.value;
            if (value === 'fit') {
                scale = 'fit';
            } else {
                scale = parseFloat(value);
            }
            renderPage(currentPage);
        }

        // ========== Text Selection & Copy ==========
        function toggleSelectMode() {
            isSelectMode = !isSelectMode;
            const btn = document.getElementById('selectMode');
            btn.classList.toggle('active', isSelectMode);
            
            document.querySelectorAll('.text-layer').forEach(layer => {
                layer.style.pointerEvents = isSelectMode ? 'auto' : 'none';
            });
            
            showToast(isSelectMode ? '✋ وضع التحديد مفعّل' : '🖱️ وضع التحديد معطّل', 'info');
        }

        function getSelectedText() {
            const selection = window.getSelection();
            return selection.toString();
        }

        function fixArabicText(text) {
            if (!text) return '';
            
            // Check if text contains Arabic
            const arabicPattern = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/;
            if (!arabicPattern.test(text)) {
                return text;
            }
            
            // Fix reversed Arabic text
            const lines = text.split('\n');
            const fixedLines = lines.map(line => {
                // Split by spaces and reverse word order for Arabic text
                const words = line.split(/\s+/);
                
                // Check if line is primarily Arabic
                const arabicWords = words.filter(w => arabicPattern.test(w)).length;
                
                if (arabicWords > words.length / 2) {
                    // Reverse word order and fix each word
                    return words.reverse().map(word => {
                        if (arabicPattern.test(word)) {
                            // Reverse the characters in Arabic word if they appear reversed
                            return word.split('').reverse().join('');
                        }
                        return word;
                    }).join(' ');
                }
                
                return line;
            });
            
            return fixedLines.join('\n');
        }

        // Smart Arabic text fixer
        function smartFixArabicText(text) {
            if (!text) return '';
            
            // Add RTL mark at the beginning
            const RTL_MARK = '\u200F';
            const LTR_MARK = '\u200E';
            
            // Pattern for Arabic text
            const arabicPattern = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/;
            
            // Split into segments
            const segments = text.split(/(\s+)/);
            let result = [];
            let arabicSegments = [];
            
            for (let segment of segments) {
                if (arabicPattern.test(segment)) {
                    arabicSegments.push(segment);
                } else if (segment.match(/^\s+$/)) {
                    if (arabicSegments.length > 0) {
                        arabicSegments.push(segment);
                    } else {
                        result.push(segment);
                    }
                } else {
                    if (arabicSegments.length > 0) {
                        // Flush Arabic segments in correct order
                        result.push(RTL_MARK + arabicSegments.join(''));
                        arabicSegments = [];
                    }
                    result.push(LTR_MARK + segment);
                }
            }
            
            if (arabicSegments.length > 0) {
                result.push(RTL_MARK + arabicSegments.join(''));
            }
            
            return result.join('');
        }

        function handleCopy(e) {
            const selection = window.getSelection();
            const selectedText = selection.toString();
            
            if (selectedText && selectedText.trim()) {
                // Check if copying from PDF text layer
                const anchorNode = selection.anchorNode;
                if (anchorNode && anchorNode.parentElement && 
                    anchorNode.parentElement.closest('.text-layer')) {
                    
                    e.preventDefault();
                    
                    // Fix the Arabic text
                    const fixedText = smartFixArabicText(selectedText);
                    
                    // Copy to clipboard
                    e.clipboardData.setData('text/plain', fixedText);
                    
                    showCopyNotification();
                }
            }
        }

        function copySelectedText() {
            const text = getSelectedText();
            if (text) {
                copyText(true);
            } else {
                showToast('⚠️ الرجاء تحديد نص أولاً', 'warning');
            }
        }

        async function copyText(fix = true) {
            const text = getSelectedText();
            if (!text) {
                showToast('⚠️ لا يوجد نص محدد', 'warning');
                return;
            }
            
            let finalText = fix ? smartFixArabicText(text) : text;
            
            try {
                await navigator.clipboard.writeText(finalText);
                showCopyNotification();
                hideContextMenu();
            } catch (err) {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = finalText;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showCopyNotification();
                hideContextMenu();
            }
        }

        function showCopyNotification() {
            const notification = document.getElementById('copyNotification');
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 2000);
        }

        // ========== Context Menu ==========
        function handleContextMenu(e) {
            const textLayer = e.target.closest('.text-layer');
            if (textLayer) {
                e.preventDefault();
                const menu = document.getElementById('contextMenu');
                menu.style.left = e.clientX + 'px';
                menu.style.top = e.clientY + 'px';
                menu.classList.add('show');
            }
        }

        function hideContextMenu() {
            document.getElementById('contextMenu').classList.remove('show');
        }

        // ========== Keyboard ==========
        function handleKeyboard(e) {
            if (e.target.tagName === 'INPUT') return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    goToPage(currentPage + 1);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    goToPage(currentPage - 1);
                    break;
                case 'ArrowUp':
                    if (results.length) {
                        e.preventDefault();
                        navResult(-1);
                    }
                    break;
                case 'ArrowDown':
                    if (results.length) {
                        e.preventDefault();
                        navResult(1);
                    }
                    break;
                case '+':
                case '=':
                    e.preventDefault();
                    changeZoom(0.25);
                    break;
                case '-':
                    e.preventDefault();
                    changeZoom(-0.25);
                    break;
            }
        }

        // ========== Download ==========
        function downloadPDF() {
            const link = document.createElement('a');
            link.href = CONFIG.PDF_FILE;
            link.download = CONFIG.PDF_FILE;
            link.click();
            showToast('💾 جاري تحميل الملف...', 'success');
        }

        // ========== Search ==========
        function doSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            
            if (!indexed) {
                showToast('⏳ انتظر اكتمال الفهرسة', 'warning');
                return;
            }
            
            results = [];
            const qLower = query.toLowerCase();
            const qArabic = toArabicNums(query);
            const qEnglish = toEnglishNums(query);
            
            pdfText.forEach(p => {
                if (!p || !p.text) return;
                const textLower = p.text.toLowerCase();
                
                let count = 0;
                [qLower, qArabic.toLowerCase(), qEnglish.toLowerCase()].forEach(q => {
                    let idx = 0;
                    while ((idx = textLower.indexOf(q, idx)) !== -1) { count++; idx++; }
                });
                
                if (count > 0) {
                    let i = textLower.indexOf(qLower);
                    if (i === -1) i = 0;
                    const start = Math.max(0, i - 50);
                    const end = Math.min(p.text.length, i + query.length + 50);
                    let ctx = p.text.substring(start, end);
                    if (start > 0) ctx = '...' + ctx;
                    if (end < p.text.length) ctx += '...';
                    
                    results.push({ page: p.page, count, ctx });
                }
            });
            
            results.sort((a, b) => b.count - a.count);
            showResults(query);
            
            if (results.length > 0) {
                resultIdx = 0;
                gotoResult(0);
            }
        }

        function showResults(query) {
            const list = document.getElementById('resultsList');
            const countEl = document.getElementById('resultsCount');
            const posEl = document.getElementById('resultPos');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            if (results.length === 0) {
                countEl.style.display = 'none';
                posEl.textContent = '-';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                list.innerHTML = `
                    <div class="placeholder">
                        <div class="placeholder-icon">😕</div>
                        <p>لا توجد نتائج لـ "${query}"</p>
                    </div>
                `;
                return;
            }
            
            const total = results.reduce((s, r) => s + r.count, 0);
            countEl.textContent = total;
            countEl.style.display = 'inline';
            posEl.textContent = `1/${results.length}`;
            prevBtn.disabled = true;
            nextBtn.disabled = results.length <= 1;
            
            const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escaped})`, 'gi');
            
            list.innerHTML = results.map((r, i) => `
                <div class="result-card ${i === 0 ? 'active' : ''}" onclick="gotoResult(${i})">
                    <div class="result-top">
                        <span class="page-badge">📄 صفحة ${r.page}</span>
                        <span class="match-count">${r.count} تطابق</span>
                    </div>
                    <div class="result-text">${r.ctx.replace(regex, '<span class="hl">$1</span>')}</div>
                    <button class="go-btn" onclick="event.stopPropagation(); gotoResult(${i})">
                        <span>←</span>
                        <span>انتقال للصفحة</span>
                    </button>
                </div>
            `).join('');
        }

        async function gotoResult(i) {
            if (i < 0 || i >= results.length) return;
            resultIdx = i;
            
            // Update UI
            document.querySelectorAll('.result-card').forEach((c, j) => {
                c.classList.toggle('active', j === i);
            });
            
            document.getElementById('resultPos').textContent = `${i + 1}/${results.length}`;
            document.getElementById('prevBtn').disabled = i === 0;
            document.getElementById('nextBtn').disabled = i === results.length - 1;
            
            // Navigate to page
            const pageNum = results[i].page;
            await goToPage(pageNum);
            
            showToast(`📄 الصفحة ${pageNum}`, 'success');
            
            // Scroll result into view
            const card = document.querySelector('.result-card.active');
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function navResult(dir) {
            const n = resultIdx + dir;
            if (n >= 0 && n < results.length) gotoResult(n);
        }

        // ========== Helpers ==========
        function toArabicNums(str) {
            const ar = '٠١٢٣٤٥٦٧٨٩';
            return str.replace(/[0-9]/g, d => ar[d]);
        }

        function toEnglishNums(str) {
            const en = '0123456789';
            const ar = '٠١٢٣٤٥٦٧٨٩';
            return str.replace(/[٠-٩]/g, d => en[ar.indexOf(d)]);
        }

        function updateLoading(text, percent) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingPercent').textContent = percent + '%';
            document.getElementById('loadingFill').style.width = percent + '%';
        }

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `show ${type}`;
            setTimeout(() => toast.className = '', 3000);
        }

        // Global functions
        window.gotoResult = gotoResult;
    </script>
</body>
