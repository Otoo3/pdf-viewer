<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 HS Code 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f172a;
            --surface: #1e293b;
            --surface2: #334155;
            --text: #f1f5f9;
            --text2: #94a3b8;
            --border: #475569;
            --highlight: #fbbf24;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); }
        
        .app { display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
        }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo span { font-size: 2.2rem; }
        .logo h1 { font-size: 1.4rem; color: #818cf8; }
        .logo small { font-size: 0.8rem; color: var(--text2); display: block; }
        
        .open-original {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 20px; background: var(--success); color: #fff;
            text-decoration: none; border-radius: 10px; font-weight: 600;
            transition: 0.2s;
        }
        .open-original:hover { filter: brightness(1.1); transform: scale(1.02); }
        
        /* Search */
        .search-area { padding: 15px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .search-box {
            display: flex; max-width: 650px; margin: 0 auto;
            background: var(--bg); border: 2px solid var(--border); 
            border-radius: 30px; padding: 5px 5px 5px 20px; transition: 0.3s;
        }
        .search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.2); }
        #searchInput {
            flex: 1; border: none; background: transparent; color: var(--text);
            font-size: 1rem; padding: 12px; outline: none; font-family: inherit;
        }
        #searchInput::placeholder { color: var(--text2); }
        #searchBtn {
            padding: 12px 28px; border: none; border-radius: 25px;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            color: #fff; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 1rem;
        }
        #searchBtn:hover { filter: brightness(1.1); }
        
        #searchStatus { 
            text-align: center; margin-top: 12px; font-size: 0.9rem; 
            color: var(--warning); padding: 8px; border-radius: 8px;
            background: rgba(245,158,11,0.1);
        }
        #searchStatus.ready { color: var(--success); background: rgba(34,197,94,0.1); }
        #searchStatus.hidden { display: none; }
        
        /* Content */
        .content { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar */
        .sidebar {
            width: 380px; background: var(--surface); border-left: 1px solid var(--border);
            display: flex; flex-direction: column;
        }
        .sidebar-header { 
            padding: 15px 20px; background: var(--surface2); 
            font-weight: 600; font-size: 1.05rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .collapse-btn {
            background: var(--bg); border: none; color: var(--text);
            width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
        }
        
        #statsBar { 
            padding: 12px 20px; background: rgba(34,197,94,0.1); 
            color: var(--success); text-align: center; font-weight: 500;
        }
        #statsBar:empty { display: none; }
        
        .results-nav { 
            display: flex; gap: 10px; padding: 12px 20px; 
            border-bottom: 1px solid var(--border); align-items: center;
        }
        .results-nav button {
            flex: 1; padding: 10px; border: none; border-radius: 10px;
            background: var(--surface2); color: var(--text); cursor: pointer; 
            font-family: inherit; font-size: 0.9rem; transition: 0.2s;
        }
        .results-nav button:disabled { opacity: 0.4; cursor: not-allowed; }
        .results-nav button:hover:not(:disabled) { background: var(--primary); }
        #resultPos { 
            padding: 10px 20px; background: var(--bg); border-radius: 10px; 
            font-size: 0.9rem; min-width: 80px; text-align: center;
        }
        
        #resultsList { flex: 1; overflow-y: auto; padding: 15px; }
        .placeholder { text-align: center; padding: 50px 20px; color: var(--text2); }
        .placeholder span { font-size: 3.5rem; display: block; margin-bottom: 15px; opacity: 0.4; }
        
        .result-card {
            background: var(--bg); border: 2px solid var(--border); border-radius: 14px;
            padding: 15px; margin-bottom: 12px; cursor: pointer; transition: 0.2s;
        }
        .result-card:hover { border-color: var(--primary); transform: translateX(-3px); }
        .result-card.active { border-color: var(--primary); background: rgba(79,70,229,0.15); }
        .result-header { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
        .page-tag { 
            padding: 5px 14px; background: linear-gradient(135deg, var(--primary), #818cf8); 
            color: #fff; border-radius: 12px; font-size: 0.85rem; font-weight: 600;
        }
        .match-count { font-size: 0.8rem; color: var(--text2); }
        .result-text { 
            font-size: 0.9rem; color: var(--text2); line-height: 1.7; 
            max-height: 70px; overflow: hidden; background: var(--surface);
            padding: 10px; border-radius: 8px;
        }
        .result-text .hl { background: var(--highlight); color: #000; padding: 1px 4px; border-radius: 3px; font-weight: 600; }
        .go-btn {
            display: block; width: 100%; margin-top: 12px; padding: 10px;
            border: none; border-radius: 10px; background: var(--primary); color: #fff;
            cursor: pointer; font-family: inherit; font-weight: 600; font-size: 0.95rem;
        }
        .go-btn:hover { filter: brightness(1.1); }
        
        /* Viewer */
        .viewer { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; }
        
        .viewer-toolbar {
            display: flex; justify-content: center; align-items: center; gap: 15px;
            padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .tool-btn { 
            padding: 10px 16px; border: none; border-radius: 10px; 
            background: var(--surface2); color: var(--text); cursor: pointer;
            font-size: 1rem; transition: 0.2s;
        }
        .tool-btn:hover:not(:disabled) { background: var(--primary); }
        .tool-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-info { 
            display: flex; align-items: center; gap: 8px;
            padding: 8px 16px; background: var(--bg); border-radius: 10px;
        }
        #pageInput { 
            width: 55px; border: none; background: transparent; color: var(--text); 
            text-align: center; font-family: inherit; font-size: 1rem;
        }
        #pageInput:focus { outline: none; }
        .zoom-info { padding: 8px 16px; background: var(--bg); border-radius: 10px; min-width: 70px; text-align: center; }
        
        .quality-notice {
            padding: 8px 20px; background: rgba(245,158,11,0.1); 
            text-align: center; font-size: 0.85rem; color: var(--warning);
            border-bottom: 1px solid var(--border);
        }
        .quality-notice a { color: var(--success); text-decoration: underline; }
        
        #pdfContainer { 
            flex: 1; overflow: auto; display: flex; justify-content: center; 
            align-items: flex-start; padding: 25px; background: #2d2d2d;
        }
        #pdfCanvas { box-shadow: 0 8px 40px rgba(0,0,0,0.5); background: #fff; }
        
        /* Toast */
        #toast {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--surface); padding: 14px 30px; border-radius: 12px;
            border-right: 4px solid var(--success); opacity: 0; transition: 0.3s; z-index: 999;
            font-size: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }
        
        /* Responsive */
        @media (max-width: 900px) {
            .content { flex-direction: column; }
            .sidebar { 
                width: 100%; max-height: 45vh; 
                border-left: none; border-bottom: 1px solid var(--border); 
            }
            .open-original span { display: none; }
        }
        @media (max-width: 500px) {
            .logo small { display: none; }
            .viewer-toolbar { gap: 8px; }
            .tool-btn { padding: 8px 12px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span>📚</span>
                <div>
                    <h1>HS Code 2026</h1>
                    <small>دليل الرموز الجمركية</small>
                </div>
            </div>
            <a id="openOriginal" class="open-original" href="#" target="_blank">
                <span>📄 فتح بجودة عالية</span>
                <span>↗</span>
            </a>
        </header>

        <!-- Search -->
        <div class="search-area">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 ابحث عن كود جمركي أو منتج...">
                <button id="searchBtn">بحث</button>
            </div>
            <div id="searchStatus">جاري التحميل...</div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <span>📊 نتائج البحث</span>
                </div>
                <div id="statsBar"></div>
                <div class="results-nav">
                    <button id="prevBtn" disabled>▲ السابق</button>
                    <span id="resultPos">-</span>
                    <button id="nextBtn" disabled>▼ التالي</button>
                </div>
                <div id="resultsList">
                    <div class="placeholder">
                        <span>🔍</span>
                        <p>اكتب في مربع البحث للعثور على النتائج</p>
                    </div>
                </div>
            </aside>

            <!-- Viewer -->
            <main class="viewer">
                <div class="viewer-toolbar">
                    <button id="prevPage" class="tool-btn" disabled>◀</button>
                    <div class="page-info">
                        <input type="number" id="pageInput" value="1" min="1">
                        <span>/</span>
                        <span id="totalPages">0</span>
                    </div>
                    <button id="nextPage" class="tool-btn" disabled>▶</button>
                    
                    <button id="zoomOut" class="tool-btn">➖</button>
                    <span id="zoomLevel" class="zoom-info">150%</span>
                    <button id="zoomIn" class="tool-btn">➕</button>
                    <button id="fitWidth" class="tool-btn">⊡</button>
                </div>
                
                <div class="quality-notice">
                    💡 للحصول على جودة عرض أفضل للنصوص العربية، 
                    <a id="openLink" href="#" target="_blank">افتح الملف الأصلي</a>
                </div>
                
                <div id="pdfContainer">
                    <canvas id="pdfCanvas"></canvas>
                </div>
            </main>
        </div>
    </div>

    <div id="toast"></div>
    
    <script>
        // ========== الإعدادات ==========
        var PDF_FILE = 'HS Code 2026.pdf';
        var DRIVE_ID = '1sxY3ePFcEOrEaJFsQ6vI8vX9NS7MEA5V';
        var DRIVE_VIEW_URL = 'https://drive.google.com/file/d/' + DRIVE_ID + '/view';
        var DRIVE_DOWNLOAD_URL = 'https://drive.google.com/uc?export=download&id=' + DRIVE_ID;
        
        pdfjsLib.GlobalWorkerOptions.workerSrc = 
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // ========== المتغيرات ==========
        var pdf = null;
        var currentPage = 1;
        var totalPages = 0;
        var scale = 1.5;
        var pdfText = [];
        var results = [];
        var resultIdx = -1;
        var indexed = false;

        // ========== البدء ==========
        window.onload = function() {
            // روابط Google Drive
            document.getElementById('openOriginal').href = DRIVE_VIEW_URL;
            document.getElementById('openLink').href = DRIVE_VIEW_URL;
            
            loadPDF();
            setupEvents();
        };

        function setupEvents() {
            document.getElementById('searchInput').oninput = function() {
                clearTimeout(window.searchTimer);
                if (this.value.length >= 2) {
                    window.searchTimer = setTimeout(doSearch, 400);
                }
            };
            document.getElementById('searchInput').onkeydown = function(e) {
                if (e.key === 'Enter') doSearch();
            };
            document.getElementById('searchBtn').onclick = doSearch;
            document.getElementById('prevBtn').onclick = function() { navResult(-1); };
            document.getElementById('nextBtn').onclick = function() { navResult(1); };
            document.getElementById('prevPage').onclick = function() { goPage(currentPage - 1); };
            document.getElementById('nextPage').onclick = function() { goPage(currentPage + 1); };
            document.getElementById('pageInput').onchange = function() { goPage(parseInt(this.value)); };
            document.getElementById('zoomIn').onclick = function() { setZoom(scale + 0.25); };
            document.getElementById('zoomOut').onclick = function() { setZoom(scale - 0.25); };
            document.getElementById('fitWidth').onclick = fitToWidth;
            
            // اختصارات
            document.onkeydown = function(e) {
                if (e.target.tagName === 'INPUT') return;
                if (e.key === 'ArrowUp') { e.preventDefault(); navResult(-1); }
                if (e.key === 'ArrowDown') { e.preventDefault(); navResult(1); }
                if (e.key === 'ArrowLeft') goPage(currentPage + 1);
                if (e.key === 'ArrowRight') goPage(currentPage - 1);
            };
        }

        // ========== تحميل PDF ==========
        function loadPDF() {
            updateStatus('جاري تحميل الملف...', false);
            
            pdfjsLib.getDocument({
                url: PDF_FILE,
                cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                cMapPacked: true,
                standardFontDataUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/'
            }).promise.then(function(pdfDoc) {
                pdf = pdfDoc;
                totalPages = pdf.numPages;
                document.getElementById('totalPages').textContent = totalPages;
                document.getElementById('pageInput').max = totalPages;
                
                renderPage(1);
                indexPDF();
            }).catch(function(err) {
                updateStatus('❌ خطأ في تحميل الملف', false);
                console.error(err);
            });
        }

        function renderPage(num) {
            if (!pdf || num < 1 || num > totalPages) return;
            currentPage = num;
            
            pdf.getPage(num).then(function(page) {
                var viewport = page.getViewport({ scale: scale });
                var canvas = document.getElementById('pdfCanvas');
                var ctx = canvas.getContext('2d');
                
                var ratio = window.devicePixelRatio || 1;
                canvas.width = viewport.width * ratio;
                canvas.height = viewport.height * ratio;
                canvas.style.width = viewport.width + 'px';
                canvas.style.height = viewport.height + 'px';
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                
                page.render({ canvasContext: ctx, viewport: viewport });
                
                document.getElementById('pageInput').value = num;
                document.getElementById('prevPage').disabled = num <= 1;
                document.getElementById('nextPage').disabled = num >= totalPages;
            });
        }

        function goPage(num) {
            num = Math.max(1, Math.min(totalPages, num));
            renderPage(num);
        }

        function setZoom(z) {
            scale = Math.max(0.5, Math.min(4, z));
            document.getElementById('zoomLevel').textContent = Math.round(scale * 100) + '%';
            renderPage(currentPage);
        }

        function fitToWidth() {
            var container = document.getElementById('pdfContainer');
            var newScale = (container.clientWidth - 50) / 612;
            setZoom(newScale);
        }

        // ========== الفهرسة ==========
        function indexPDF() {
            pdfText = [];
            var done = 0;
            
            for (var i = 1; i <= totalPages; i++) {
                (function(pageNum) {
                    pdf.getPage(pageNum).then(function(page) {
                        return page.getTextContent();
                    }).then(function(content) {
                        var text = content.items.map(function(item) { return item.str; }).join(' ');
                        pdfText[pageNum - 1] = { page: pageNum, text: text };
                        done++;
                        updateStatus('فهرسة الصفحة ' + done + ' من ' + totalPages + '...', false);
                        if (done === totalPages) finishIndex();
                    }).catch(function() {
                        pdfText[pageNum - 1] = { page: pageNum, text: '' };
                        done++;
                        if (done === totalPages) finishIndex();
                    });
                })(i);
            }
        }

        function finishIndex() {
            pdfText.sort(function(a, b) { return a.page - b.page; });
            indexed = true;
            updateStatus('✅ جاهز للبحث (' + totalPages + ' صفحة)', true);
            setTimeout(function() {
                document.getElementById('searchStatus').classList.add('hidden');
            }, 3000);
        }

        function updateStatus(text, isReady) {
            var el = document.getElementById('searchStatus');
            el.textContent = text;
            el.classList.remove('hidden');
            if (isReady) {
                el.classList.add('ready');
            } else {
                el.classList.remove('ready');
            }
        }

        // ========== البحث ==========
        function doSearch() {
            var query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            
            if (!indexed) {
                showToast('⏳ انتظر اكتمال الفهرسة');
                return;
            }
            
            results = [];
            var qLower = query.toLowerCase();
            var qArabic = toArabicNums(query);
            var qEnglish = toEnglishNums(query);
            
            pdfText.forEach(function(p) {
                if (!p || !p.text) return;
                var textLower = p.text.toLowerCase();
                
                var count = 0;
                [qLower, qArabic.toLowerCase(), qEnglish.toLowerCase()].forEach(function(q) {
                    var idx = 0;
                    while ((idx = textLower.indexOf(q, idx)) !== -1) { count++; idx++; }
                });
                
                if (count > 0) {
                    var i = textLower.indexOf(qLower);
                    if (i === -1) i = 0;
                    var start = Math.max(0, i - 50);
                    var end = Math.min(p.text.length, i + query.length + 50);
                    var ctx = p.text.substring(start, end);
                    if (start > 0) ctx = '...' + ctx;
                    if (end < p.text.length) ctx += '...';
                    results.push({ page: p.page, count: count, ctx: ctx });
                }
            });
            
            results.sort(function(a, b) { return b.count - a.count; });
            showResults(query);
            if (results.length > 0) { resultIdx = 0; gotoResult(0); }
        }

        function showResults(query) {
            var list = document.getElementById('resultsList');
            var stats = document.getElementById('statsBar');
            
            if (results.length === 0) {
                stats.textContent = '';
                list.innerHTML = '<div class="placeholder"><span>😕</span><p>لا توجد نتائج لـ "' + query + '"</p></div>';
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
                document.getElementById('resultPos').textContent = '-';
                return;
            }
            
            var total = results.reduce(function(s, r) { return s + r.count; }, 0);
            stats.textContent = '✅ ' + total + ' نتيجة في ' + results.length + ' صفحة';
            document.getElementById('resultPos').textContent = '1/' + results.length;
            document.getElementById('prevBtn').disabled = true;
            document.getElementById('nextBtn').disabled = results.length <= 1;
            
            var escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            var regex = new RegExp('(' + escaped + ')', 'gi');
            
            var html = '';
            results.forEach(function(r, i) {
                var hl = r.ctx.replace(regex, '<span class="hl">$1</span>');
                html += '<div class="result-card' + (i === 0 ? ' active' : '') + '" onclick="gotoResult(' + i + ')">';
                html += '<div class="result-header">';
                html += '<span class="page-tag">📄 صفحة ' + r.page + '</span>';
                html += '<span class="match-count">' + r.count + ' تطابق</span>';
                html += '</div>';
                html += '<div class="result-text">' + hl + '</div>';
                html += '<button class="go-btn" onclick="event.stopPropagation();gotoResult(' + i + ')">← انتقال للصفحة</button>';
                html += '</div>';
            });
            list.innerHTML = html;
        }

        function gotoResult(i) {
            if (i < 0 || i >= results.length) return;
            resultIdx = i;
            
            document.querySelectorAll('.result-card').forEach(function(c, j) {
                c.classList.toggle('active', j === i);
            });
            
            document.getElementById('resultPos').textContent = (i + 1) + '/' + results.length;
            document.getElementById('prevBtn').disabled = i === 0;
            document.getElementById('nextBtn').disabled = i === results.length - 1;
            
            goPage(results[i].page);
            showToast('📄 صفحة ' + results[i].page);
            
            var card = document.querySelector('.result-card.active');
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function navResult(dir) {
            var n = resultIdx + dir;
            if (n >= 0 && n < results.length) gotoResult(n);
        }

        // ========== المساعدات ==========
        function toArabicNums(str) {
            var ar = '٠١٢٣٤٥٦٧٨٩';
            return str.replace(/[0-9]/g, function(d) { return ar[d]; });
        }

        function toEnglishNums(str) {
            var en = '0123456789';
            var ar = '٠١٢٣٤٥٦٧٨٩';
            return str.replace(/[٠-٩]/g, function(d) { return en[ar.indexOf(d)]; });
        }

        function showToast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(function() { t.classList.remove('show'); }, 2500);
        }

        window.gotoResult = gotoResult;
    </script>
</body>
</html>
