<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 HS Code 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://acrobatservices.adobe.com/view-sdk/viewer.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f0f1a;
            --surface: #1a1a2e;
            --text: #fff;
            --text2: #a0a0b0;
            --border: #2a2a40;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo span { font-size: 2rem; }
        .logo h1 { font-size: 1.4rem; color: var(--primary); }
        
        #themeBtn {
            padding: 10px 15px;
            background: var(--border);
            border: none;
            border-radius: 10px;
            color: var(--text);
            font-size: 1.2rem;
            cursor: pointer;
        }
        
        /* PDF Container */
        #pdf-container {
            width: 100%;
            height: calc(100vh - 70px);
        }
        
        /* Toast */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface);
            padding: 15px 30px;
            border-radius: 15px;
            border: 1px solid var(--primary);
            opacity: 0;
            transition: all 0.3s;
            z-index: 9999;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <span>📚</span>
            <h1>HS Code 2026</h1>
        </div>
        <button id="themeBtn">🌙</button>
    </header>

    <div id="pdf-container"></div>
    <div id="toast"></div>

    <script>
        const CLIENT_ID = '5edf16250afa446aa490af6313d351b2';
        const PDF_FILE = 'HS Code 2026.pdf';
        
        // انتظار تحميل Adobe SDK
        if (window.AdobeDC) {
            loadPDF();
        } else {
            document.addEventListener('adobe_dc_view_sdk.ready', loadPDF);
        }
        
        function loadPDF() {
            const adobeDCView = new AdobeDC.View({
                clientId: CLIENT_ID,
                divId: 'pdf-container'
            });
            
            adobeDCView.previewFile({
                content: { location: { url: PDF_FILE } },
                metaData: { fileName: 'HS Code 2026.pdf' }
            }, {
                embedMode: 'FULL_WINDOW',
                defaultViewMode: 'FIT_WIDTH',
                showDownloadPDF: true,
                showPrintPDF: true,
                showLeftHandPanel: true,
                showAnnotationTools: false
            }).then(function() {
                showToast('✅ تم تحميل الملف - استخدم Ctrl+F للبحث');
            }).catch(function(error) {
                showToast('⚠️ خطأ في التحميل');
                console.error(error);
            });
        }
        
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 4000);
        }
        
        // Theme toggle
        document.getElementById('themeBtn').onclick = function() {
            const isLight = document.body.style.background === 'rgb(248, 250, 252)';
            if (isLight) {
                document.body.style.background = '#0f0f1a';
                document.body.style.color = '#fff';
                this.textContent = '🌙';
            } else {
                document.body.style.background = '#f8fafc';
                document.body.style.color = '#1e293b';
                this.textContent = '☀️';
            }
        };
    </script>
</body>
</html>
