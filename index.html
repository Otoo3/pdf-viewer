<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 HS Code 2026</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <!-- الهيدر -->
    <header class="header">
        <h1>📚 HS Code 2026</h1>
        <p>دليل الرموز الجمركية</p>
    </header>

    <!-- شريط البحث -->
    <div class="search-bar">
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="🔍 ابحث عن كود جمركي أو منتج...">
            <button id="searchBtn">بحث</button>
            <button id="clearBtn" class="btn-clear">✕</button>
        </div>
        <div id="indexStatus" class="index-status">
            <div class="spinner-small"></div>
            <span>جاري تجهيز البحث...</span>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <!-- نتائج البحث (الجانب) -->
        <aside id="searchPanel" class="search-panel">
            <div class="panel-header">
                <h3>🔍 نتائج البحث</h3>
                <button id="togglePanel" class="toggle-btn">◀</button>
            </div>
            <div id="searchStats" class="search-stats"></div>
            <div id="searchResults" class="search-results">
                <div class="empty-state">
                    <p>📝 ابدأ البحث للعثور على النتائج</p>
                </div>
            </div>
        </aside>

        <!-- عارض PDF -->
        <main class="pdf-viewer">
            <iframe 
                id="pdfFrame"
                src=""
                frameborder="0"
                allowfullscreen>
            </iframe>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
