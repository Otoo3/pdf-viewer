<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 HS Code 2026 - دليل الرموز الجمركية</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        /* ========== Theme Variables ========== */
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1e1e2e;
            --surface3: #2a2a3e;
            --text: #f1f5f9;
            --text2: #94a3b8;
            --text3: #64748b;
            --border: #2e2e42;
            --highlight: #fbbf24;
            --highlight-bg: rgba(251, 191, 36, 0.3);
            --highlight-active: #f97316;
            --highlight-active-bg: rgba(249, 115, 22, 0.5);
            --pinned-bg: rgba(34, 197, 94, 0.15);
            --pinned-border: #22c55e;
            --glow: rgba(99, 102, 241, 0.4);
            --shadow: rgba(0, 0, 0, 0.3);
            --pdf-bg: #525252;
            --panel-width: 380px;
        }
        
        [data-theme="light"] {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface2: #f1f5f9;
            --surface3: #e2e8f0;
            --text: #1e293b;
            --text2: #475569;
            --text3: #64748b;
            --border: #cbd5e1;
            --glow: rgba(99, 102, 241, 0.2);
            --shadow: rgba(0, 0, 0, 0.1);
            --pdf-bg: #9ca3af;
            --pinned-bg: rgba(34, 197, 94, 0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: var(--bg); 
            color: var(--text);
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }
        
        /* ========== Scrollbar ========== */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--surface2); border-radius: 5px; }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, var(--primary), #8b5cf6);
            border-radius: 5px;
            border: 2px solid var(--surface2);
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-light); }
        
        * { scrollbar-width: thin; scrollbar-color: var(--primary) var(--surface2); }
        
        /* ========== App Layout ========== */
        .app {
            display: grid;
            grid-template-rows: auto auto 1fr;
            height: 100vh;
        }
        
        /* ========== Header ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: linear-gradient(180deg, var(--surface) 0%, var(--surface2) 100%);
            border-bottom: 1px solid var(--border);
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-icon { font-size: 2rem; filter: drop-shadow(0 0 10px var(--glow)); }
        
        .logo h1 {
            font-size: 1.3rem;
            background: linear-gradient(135deg, var(--primary-light), #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .logo p { font-size: 0.75rem; color: var(--text2); }
        
        .header-controls { display: flex; align-items: center; gap: 10px; }
        
        /* Theme Toggle */
        .theme-toggle {
            width: 56px; height: 28px;
            background: var(--surface3);
            border-radius: 14px;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5px;
            position: relative;
        }
        
        .theme-toggle:hover { border-color: var(--primary); }
        .theme-toggle-icon { font-size: 0.9rem; z-index: 1; transition: opacity 0.3s; }
        .theme-toggle .sun { opacity: 0.4; }
        .theme-toggle .moon { opacity: 1; }
        [data-theme="light"] .theme-toggle .sun { opacity: 1; }
        [data-theme="light"] .theme-toggle .moon { opacity: 0.4; }
        
        .theme-toggle-slider {
            position: absolute;
            width: 20px; height: 20px;
            background: var(--primary);
            border-radius: 50%;
            right: 4px;
            transition: all 0.3s;
        }
        
        [data-theme="light"] .theme-toggle-slider { right: calc(100% - 24px); }
        
        .toggle-panel-btn {
            padding: 8px 14px;
            background: var(--surface3);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }
        
        .toggle-panel-btn:hover {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }
        
        /* ========== Search Bar ========== */
        .search-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
        }
        
        .search-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .search-input-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        
        #searchInput {
            width: 100%;
            padding: 12px 18px 12px 45px;
            background: var(--surface2);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }
        
        #searchInput:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--glow);
        }
        
        #searchInput::placeholder { color: var(--text3); }
        
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: var(--text3);
            pointer-events: none;
        }
        
        .text-fixed-indicator {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            color: var(--success);
            background: var(--surface3);
            padding: 2px 8px;
            border-radius: 10px;
            display: none;
        }
        
        .text-fixed-indicator.show { display: block; }
        
        #searchBtn {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        #searchBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--glow);
        }
        
        /* Mini Navigation */
        .mini-nav {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--surface2);
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        
        .mini-nav.hidden { display: none; }
        
        .mini-nav-count {
            font-size: 0.85rem;
            color: var(--text);
            font-weight: 600;
            min-width: 80px;
            text-align: center;
        }
        
        .mini-nav-count .highlight { color: var(--primary-light); }
        
        .mini-nav-btn {
            width: 32px; height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .mini-nav-btn:hover:not(:disabled) {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        
        .mini-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .search-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--surface2);
            border-radius: 10px;
            font-size: 0.8rem;
            color: var(--text2);
            white-space: nowrap;
        }
        
        .search-status.loading { color: var(--warning); }
        .search-status.ready { color: var(--success); }
        .search-status.hidden { display: none; }
        
        .spinner {
            width: 12px; height: 12px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* ========== Main Content ========== */
        .main-content {
            display: grid;
            grid-template-columns: var(--panel-width) 1fr;
            overflow: hidden;
            transition: grid-template-columns 0.3s;
        }
        
        .main-content.panel-hidden { grid-template-columns: 0 1fr; }
        
        /* ========== Results Panel ========== */
        .results-panel {
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s;
        }
        
        .main-content.panel-hidden .results-panel {
            opacity: 0;
            pointer-events: none;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        
        .results-header h3 {
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        #resultsCount {
            padding: 3px 8px;
            background: var(--primary);
            border-radius: 12px;
            font-size: 0.7rem;
            color: white;
        }
        
        .results-actions { display: flex; gap: 5px; align-items: center; }
        
        .action-btn {
            width: 28px; height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text2);
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        
        .action-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        
        .nav-controls {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 10px 15px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        
        .nav-btn {
            width: 30px; height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        
        .nav-btn:hover:not(:disabled) {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        #resultPos {
            flex: 1;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text2);
            padding: 0 8px;
        }
        
        /* Pinned Section */
        .pinned-section {
            background: var(--pinned-bg);
            border-bottom: 2px solid var(--pinned-border);
            max-height: 150px;
            overflow-y: auto;
            display: none;
            flex-shrink: 0;
        }
        
        .pinned-section.has-items { display: block; }
        
        .pinned-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(34, 197, 94, 0.1);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--pinned-border);
            position: sticky;
            top: 0;
            z-index: 1;
        }
        
        .clear-pinned {
            font-size: 0.7rem;
            padding: 3px 8px;
            background: var(--surface3);
            border: none;
            border-radius: 10px;
            color: var(--text2);
            cursor: pointer;
        }
        
        .clear-pinned:hover { background: var(--error); color: white; }
        
        #pinnedList { padding: 8px; }
        
        /* Results List */
        #resultsList {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 10px;
            scroll-behavior: smooth;
            min-height: 0;
        }
        
        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text3);
            text-align: center;
            padding: 20px;
        }
        
        .placeholder-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
        
        /* Result Card */
        .result-card {
            background: var(--surface2);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .result-card:hover {
            border-color: var(--primary);
            transform: translateX(-3px);
            box-shadow: 3px 0 12px var(--glow);
        }
        
        .result-card.active {
            border-color: var(--highlight-active);
            background: var(--highlight-active-bg);
        }
        
        .result-card.pinned {
            border-color: var(--pinned-border);
            background: var(--pinned-bg);
        }
        
        .result-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .page-badge {
            padding: 4px 10px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
        }
        
        .result-actions { display: flex; gap: 4px; }
        
        .result-action-btn {
            width: 26px; height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface3);
            border: none;
            border-radius: 5px;
            color: var(--text2);
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        
        .result-action-btn:hover { background: var(--primary); color: white; }
        .result-action-btn.copy-btn:hover { background: var(--info); }
        .result-action-btn.pin-btn:hover { background: var(--success); }
        .result-action-btn.delete-btn:hover { background: var(--error); }
        .result-action-btn.pinned { background: var(--success); color: white; }
        
        .result-text {
            font-size: 0.8rem;
            color: var(--text2);
            line-height: 1.6;
            padding: 8px;
            background: var(--bg);
            border-radius: 6px;
            max-height: 60px;
            overflow: hidden;
            user-select: text;
        }
        
        .result-text .hl {
            background: var(--highlight);
            color: #000;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: 600;
        }
        
        .result-buttons {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        
        .go-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px;
            background: var(--primary);
            border: none;
            border-radius: 6px;
            color: white;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .go-btn:hover { filter: brightness(1.15); }
        
        .copy-result-btn {
            padding: 8px 12px;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .copy-result-btn:hover {
            background: var(--info);
            border-color: var(--info);
            color: white;
        }
        
        /* ========== PDF Viewer Section ========== */
        .pdf-section {
            position: relative;
            background: var(--pdf-bg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* PDF Toolbar */
        .pdf-toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 8px 15px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        
        .pdf-toolbar-btn {
            width: 36px; height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .pdf-toolbar-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        
        .pdf-toolbar-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .page-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text);
        }
        
        #pageInput {
            width: 60px;
            padding: 6px 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            text-align: center;
        }
        
        #pageInput:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-right: 15px;
            padding-right: 15px;
            border-right: 1px solid var(--border);
        }
        
        #zoomLevel {
            min-width: 50px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text2);
        }
        
        /* PDF Container */
        #pdfContainer {
            flex: 1;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            scroll-behavior: smooth;
        }
        
        .pdf-page-wrapper {
            position: relative;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            background: white;
        }
        
        .pdf-page-wrapper canvas {
            display: block;
        }
        
        /* Text Layer for selection and highlighting */
        .text-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            opacity: 0.2;
            line-height: 1.0;
            pointer-events: auto;
        }
        
        .text-layer > span {
            color: transparent;
            position: absolute;
            white-space: pre;
            cursor: text;
            transform-origin: 0% 0%;
        }
        
        .text-layer > span::selection {
            background: rgba(0, 0, 255, 0.3);
        }
        
        /* Highlight Layer */
        .highlight-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 1;
        }
        
        .search-highlight {
            position: absolute;
            background: var(--highlight);
            opacity: 0.4;
            border-radius: 2px;
            pointer-events: none;
            transition: all 0.3s;
        }
        
        .search-highlight.active {
            background: var(--highlight-active);
            opacity: 0.6;
            box-shadow: 0 0 10px var(--highlight-active);
            animation: pulse-highlight 1s ease-in-out infinite;
        }
        
        @keyframes pulse-highlight {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        
        /* Page Number Badge */
        .page-number-badge {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface2);
            color: var(--text2);
            padding: 3px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
        }
        
        /* ========== Loading Overlay ========== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s, visibility 0.5s;
        }
        
        .loading-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .loading-logo { font-size: 4.5rem; margin-bottom: 18px; animation: bounce 2s ease-in-out infinite; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        
        .loading-overlay h2 {
            font-size: 1.8rem;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #c7d2fe, #e9d5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .loading-overlay p {
            color: rgba(255,255,255,0.7);
            font-size: 0.95rem;
            margin-bottom: 22px;
        }
        
        .loading-bar {
            width: 260px;
            height: 5px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .loading-fill {
            height: 100%;
            background: linear-gradient(90deg, #818cf8, #c084fc, #818cf8);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 3px;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        #loadingPercent {
            margin-top: 10px;
            font-size: 1rem;
            color: rgba(255,255,255,0.9);
        }
        
        /* ========== Toast ========== */
        #toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface2);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 10px;
            box-shadow: 0 10px 40px var(--shadow);
            opacity: 0;
            transition: all 0.3s;
            z-index: 9999;
            color: var(--text);
            font-size: 0.9rem;
        }
        
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        #toast.success { border-color: var(--success); }
        #toast.error { border-color: var(--error); }
        #toast.warning { border-color: var(--warning); }
        #toast.info { border-color: var(--info); }
        
        /* ========== Responsive ========== */
        @media (max-width: 1024px) {
            :root { --panel-width: 320px; }
            
            .main-content {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 40vh;
            }
            
            .main-content.panel-hidden { grid-template-rows: 1fr 0; }
            
            .results-panel {
                border-left: none;
                border-top: 1px solid var(--border);
                order: 2;
            }
            
            .pdf-section { order: 1; }
        }
        
        @media (max-width: 600px) {
            .header { padding: 8px 12px; }
            .logo h1 { font-size: 1.1rem; }
            .logo p { display: none; }
            .search-bar { padding: 10px 12px; }
            .search-container { flex-direction: column; }
            #searchBtn { width: 100%; }
            .toggle-panel-btn span:last-child { display: none; }
            .mini-nav { width: 100%; justify-content: center; }
            .pdf-toolbar { flex-wrap: wrap; }
            .zoom-controls { border-right: none; margin-right: 0; padding-right: 0; }
        }
    </style>
</head>
<body data-theme="dark">

        <div class="loading-bar">
            <div id="loadingFill" class="loading-fill" style="width: 0%"></div>
        </div>
        <div id="loadingPercent">0%</div>
    </div>

    <!-- Main App -->
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">📚</span>
                <div>
                    <h1>HS Code 2026</h1>

            <div class="header-controls">
                <button class="toggle-panel-btn" onclick="togglePanel()" title="إخفاء/إظهار النتائج">

                </button>
                <div class="theme-toggle" onclick="toggleTheme()" title="الوضع الليلي/النهاري">

        <!-- Search Bar -->

                    <div class="results-actions">
                        <button class="action-btn" onclick="clearAllResults()" title="مسح الكل">🗑️</button>

                <div class="nav-controls">

                <div id="pinnedSection" class="pinned-section">

                    </div>
                    <div id="pinnedList"></div>
                </div>
                
                <div id="resultsList">
                    <div class="placeholder">
                        <div class="placeholder-icon">🔍</div>
                        <p>اكتب في مربع البحث<br>للعثور على الأكواد</p>
                    </div>
                </div>
            </aside>

            <!-- PDF Viewer -->
            <main class="pdf-section">
                <!-- PDF Toolbar -->
                <div class="pdf-toolbar">
                    <div class="zoom-controls">
                        <button class="pdf-toolbar-btn" onclick="zoomOut()" title="تصغير">➖</button>
                        <span id="zoomLevel">100%</span>
                        <button class="pdf-toolbar-btn" onclick="zoomIn()" title="تكبير">➕</button>
                        <button class="pdf-toolbar-btn" onclick="fitWidth()" title="ملائمة العرض">↔️</button>

                    <button class="pdf-toolbar-btn" onclick="goToPrevPage()" id="prevPageBtn" title="الصفحة السابقة">◀</button>
                    
                    <div class="page-info">
                        <input type="number" id="pageInput" value="1" min="1" onchange="goToPage(this.value)">
                        <span>من</span>
                        <span id="totalPagesDisplay">0</span>
                    </div>
                    
                    <button class="pdf-toolbar-btn" onclick="goToNextPage()" id="nextPageBtn" title="الصفحة التالية">▶</button>
                    
                    <button class="pdf-toolbar-btn" onclick="downloadPDF()" title="تحميل">⬇️</button>
                </div>
                
                <!-- PDF Pages Container -->
                <div id="pdfContainer"></div>
            </main>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <script>
        // ========== Configuration ==========
        const CONFIG = {
            PDF_FILE: 'HS Code 2026.pdf',
            SEARCH_DELAY: 300,
            MIN_SEARCH_LENGTH: 2,
            INITIAL_SCALE: 1.2,
            SCALE_STEP: 0.2,
            MIN_SCALE: 0.5,
            MAX_SCALE: 3.0,
            PAGES_TO_RENDER: 5 // عدد الصفحات للتحميل المسبق
        };
        
        pdfjsLib.GlobalWorkerOptions.workerSrc = 
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // ========== State ==========
        let pdfDoc = null;
        let pdfText = [];
        let pageTextItems = []; // لحفظ مواقع النصوص
        let results = [];
        let pinnedResults = [];
        let resultIdx = -1;
        let totalPages = 0;
        let currentPage = 1;
        let currentScale = CONFIG.INITIAL_SCALE;
        let indexed = false;
        let currentSearchTerm = '';
        let panelVisible = true;
        let renderedPages = new Set();
        let highlightElements = [];

        // ========== Initialize ==========
        document.addEventListener('DOMContentLoaded', initApp);

        async function initApp() {
            initTheme();
            setupEvents();
            await loadPDF();
        }

        // ========== Theme ==========
        function initTheme() {
            const saved = localStorage.getItem('hs-code-theme');
            if (saved) document.body.setAttribute('data-theme', saved);
        }
        
        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('hs-code-theme', newTheme);
            showToast(newTheme === 'dark' ? '🌙 الوضع الليلي' : '☀️ الوضع النهاري', 'success');
        }

        // ========== Panel Toggle ==========
        function togglePanel() {
            panelVisible = !panelVisible;
            document.getElementById('mainContent').classList.toggle('panel-hidden', !panelVisible);
            document.getElementById('panelToggleIcon').textContent = panelVisible ? '◀' : '▶';
        }

        // ========== Events Setup ==========
        function setupEvents() {
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            
            // Paste handler
            searchInput.addEventListener('paste', handlePaste);
            
            // Search on input
            let searchTimer;
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimer);
                if (this.value.length >= CONFIG.MIN_SEARCH_LENGTH) {
                    searchTimer = setTimeout(doSearch, CONFIG.SEARCH_DELAY);
                } else if (this.value.length === 0) {
                    clearSearchResults();
                }
            });
            
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    clearTimeout(searchTimer);
                    doSearch();
                }
                if (e.key === 'ArrowDown' && results.length > 0) {
                    e.preventDefault();
                    navResult(1);
                }
                if (e.key === 'ArrowUp' && results.length > 0) {
                    e.preventDefault();
                    navResult(-1);
                }
            });
            
            searchBtn.addEventListener('click', doSearch);
            document.getElementById('prevBtn').addEventListener('click', () => navResult(-1));
            document.getElementById('nextBtn').addEventListener('click', () => navResult(1));
            
            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT') return;
                
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                }
            });
            
            // PDF container scroll
            document.getElementById('pdfContainer').addEventListener('scroll', handleScroll);
            
            // Load pinned
            loadPinnedResults();
        }

        // ========== Paste Handler ==========
        function handlePaste(e) {
            e.preventDefault();
            const pastedText = (e.clipboardData || window.clipboardData).getData('text');
            const fixResult = fixReversedText(pastedText);
            
            const input = e.target;
            const start = input.selectionStart;
            const end = input.selectionEnd;
            input.value = input.value.substring(0, start) + fixResult.text + input.value.substring(end);
            input.selectionStart = input.selectionEnd = start + fixResult.text.length;
            
            if (fixResult.wasFixed) {
                document.getElementById('textFixedIndicator').classList.add('show');
                setTimeout(() => document.getElementById('textFixedIndicator').classList.remove('show'), 2000);
                showToast('✨ تم إصلاح النص تلقائياً', 'success');
            }
            
            if (fixResult.text.length >= CONFIG.MIN_SEARCH_LENGTH) {
                setTimeout(doSearch, 100);
            }
        }

        // ========== Text Processing ==========
        function fixReversedText(text) {
            if (!text) return { text: text, wasFixed: false };
            
            let fixed = text.replace(/\s+/g, ' ').trim();
            let wasFixed = false;
            
            // Fix code patterns
            const codePattern = /(\d{2}\s*){3,6}/g;
            const matches = fixed.match(codePattern);
            
            if (matches) {
                matches.forEach(match => {
                    const cleanCode = match.replace(/\s/g, '');
                    fixed = fixed.replace(match, cleanCode);
                    if (match !== cleanCode) wasFixed = true;
                });
            }
            
            fixed = normalizeNumbers(fixed);
            return { text: fixed, wasFixed };
        }
        
        function normalizeNumbers(text) {
            const arabicNums = '٠١٢٣٤٥٦٧٨٩';
            const englishNums = '0123456789';
            let result = text;
            for (let i = 0; i < 10; i++) {
                result = result.replace(new RegExp(arabicNums[i], 'g'), englishNums[i]);
            }
            return result;
        }
        
        function toArabicNums(str) {
            const ar = '٠١٢٣٤٥٦٧٨٩';
            return str.replace(/[0-9]/g, d => ar[d]);
        }

        // ========== PDF Loading ==========
        async function loadPDF() {
            updateLoading('جاري تحميل الملف...', 10);
            
            try {
                pdfDoc = await pdfjsLib.getDocument({
                    url: CONFIG.PDF_FILE,
                    cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                    cMapPacked: true
                }).promise;
                
                totalPages = pdfDoc.numPages;
                document.getElementById('totalPagesDisplay').textContent = totalPages;
                document.getElementById('pageInput').max = totalPages;
                
                updateLoading('جاري عرض الصفحات...', 30);
                
                // Render initial pages
                await renderVisiblePages();
                
                updateLoading('جاري فهرسة النصوص...', 50);
                
                // Index all pages for search
                await indexAllPages();
                
                indexed = true;
                updateLoading('جاهز!', 100);
                
                const status = document.getElementById('searchStatus');
                status.className = 'search-status ready';
                status.innerHTML = `<span>✅</span><span>جاهز (${totalPages} صفحة)</span>`;
                
                setTimeout(() => {
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    setTimeout(() => status.classList.add('hidden'), 2000);
                }, 500);
                
            } catch (error) {
                console.error('PDF Load Error:', error);
                showToast('⚠️ خطأ في تحميل الملف', 'error');
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }

        // ========== PDF Rendering ==========
        async function renderPage(pageNum) {
            if (renderedPages.has(pageNum)) return;
            
            try {
                const page = await pdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: currentScale });
                
                // Create wrapper
                const wrapper = document.createElement('div');
                wrapper.className = 'pdf-page-wrapper';
                wrapper.id = `page-wrapper-${pageNum}`;
                wrapper.dataset.pageNum = pageNum;
                wrapper.style.width = `${viewport.width}px`;
                wrapper.style.height = `${viewport.height}px`;
                
                // Create canvas
                const canvas = document.createElement('canvas');
                canvas.id = `page-canvas-${pageNum}`;
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                const ctx = canvas.getContext('2d');
                
                // Create text layer
                const textLayer = document.createElement('div');
                textLayer.className = 'text-layer';
                textLayer.id = `text-layer-${pageNum}`;
                
                // Create highlight layer
                const highlightLayer = document.createElement('div');
                highlightLayer.className = 'highlight-layer';
                highlightLayer.id = `highlight-layer-${pageNum}`;
                
                // Page number badge
                const badge = document.createElement('div');
                badge.className = 'page-number-badge';
                badge.textContent = `صفحة ${pageNum}`;
                
                wrapper.appendChild(canvas);
                wrapper.appendChild(highlightLayer);
                wrapper.appendChild(textLayer);
                wrapper.appendChild(badge);
                
                // Insert in correct order
                const container = document.getElementById('pdfContainer');
                const existingWrappers = container.querySelectorAll('.pdf-page-wrapper');
                let inserted = false;
                
                for (let w of existingWrappers) {
                    if (parseInt(w.dataset.pageNum) > pageNum) {
                        container.insertBefore(wrapper, w);
                        inserted = true;
                        break;
                    }
                }
                
                if (!inserted) {
                    container.appendChild(wrapper);
                }
                
                // Render page
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                
                // Render text layer
                const textContent = await page.getTextContent();
                await renderTextLayer(textLayer, textContent, viewport, pageNum);
                
                renderedPages.add(pageNum);
                
            } catch (error) {
                console.error(`Error rendering page ${pageNum}:`, error);
            }
        }
        
        async function renderTextLayer(container, textContent, viewport, pageNum) {
            const textItems = textContent.items;
            pageTextItems[pageNum] = [];
            
            textItems.forEach((item, idx) => {
                const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
                
                const span = document.createElement('span');
                span.textContent = item.str;
                span.style.left = `${tx[4]}px`;
                span.style.top = `${tx[5]}px`;
                span.style.fontSize = `${Math.sqrt(tx[0] * tx[0] + tx[1] * tx[1])}px`;
                span.style.fontFamily = item.fontName || 'sans-serif';
                
                // Calculate width
                if (item.width) {
                    span.style.width = `${item.width * viewport.scale}px`;
                }
                
                container.appendChild(span);
                
                // Store position for highlighting
                pageTextItems[pageNum].push({
                    str: item.str,
                    left: tx[4],
                    top: tx[5] - (Math.sqrt(tx[0] * tx[0] + tx[1] * tx[1])),
                    width: item.width * viewport.scale || span.offsetWidth,
                    height: Math.sqrt(tx[0] * tx[0] + tx[1] * tx[1]) * 1.2,
                    element: span
                });
            });
        }
        
        async function renderVisiblePages() {
            const container = document.getElementById('pdfContainer');
            const scrollTop = container.scrollTop;
            const viewportHeight = container.clientHeight;
            
            // Calculate which pages should be visible
            const pageHeight = 842 * currentScale + 45; // A4 height + margin
            const firstVisible = Math.max(1, Math.floor(scrollTop / pageHeight) + 1);
            const lastVisible = Math.min(totalPages, Math.ceil((scrollTop + viewportHeight) / pageHeight) + 1);
            
            // Render visible pages plus buffer
            const start = Math.max(1, firstVisible - 2);
            const end = Math.min(totalPages, lastVisible + 2);
            
            for (let i = start; i <= end; i++) {
                await renderPage(i);
            }
        }
        
        function handleScroll() {
            renderVisiblePages();
            
            // Update current page indicator
            const container = document.getElementById('pdfContainer');
            const pageHeight = 842 * currentScale + 45;
            const newPage = Math.floor(container.scrollTop / pageHeight) + 1;
            
            if (newPage !== currentPage && newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                document.getElementById('pageInput').value = currentPage;
            }
        }

        // ========== Indexing ==========
        async function indexAllPages() {
            pdfText = [];
            
            for (let i = 1; i <= totalPages; i++) {
                const percent = 50 + Math.round((i / totalPages) * 45);
                updateLoading(`فهرسة صفحة ${i} من ${totalPages}...`, percent);
                
                try {
                    const page = await pdfDoc.getPage(i);
                    const content = await page.getTextContent();
                    const text = content.items.map(item => item.str).join(' ');
                    
                    pdfText.push({
                        page: i,
                        text: text,
                        textNoSpaces: text.replace(/\s/g, ''),
                        items: content.items
                    });
                } catch (e) {
                    pdfText.push({ page: i, text: '', textNoSpaces: '', items: [] });
                }
            }
        }

        function updateLoading(text, percent) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingPercent').textContent = percent + '%';
            document.getElementById('loadingFill').style.width = percent + '%';
        }

        // ========== Search ==========
        function doSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query || query.length < CONFIG.MIN_SEARCH_LENGTH) return;
            
            if (!indexed) {
                showToast('⏳ انتظر اكتمال الفهرسة', 'warning');
                return;
            }
            
            currentSearchTerm = query;
            results = [];
            clearHighlights();
            
            const queryLower = query.toLowerCase();
            const queryNoSpaces = query.replace(/\s/g, '').toLowerCase();
            const queryNormalized = normalizeNumbers(queryNoSpaces);
            
            pdfText.forEach(p => {
                if (!p || !p.text) return;
                
                const textLower = p.text.toLowerCase();
                const textNoSpaces = p.textNoSpaces.toLowerCase();
                
                let count = 0;
                let positions = [];
                
                // Search with spaces
                let idx = 0;
                while ((idx = textLower.indexOf(queryLower, idx)) !== -1) {
                    count++;
                    positions.push({ start: idx, length: query.length });
                    idx++;
                }
                
                // Search without spaces
                idx = 0;
                while ((idx = textNoSpaces.indexOf(queryNoSpaces, idx)) !== -1) {
                    count++;
                    idx++;
                }
                
                if (count > 0) {
                    const firstPos = positions[0]?.start || 0;
                    const start = Math.max(0, firstPos - 35);
                    const end = Math.min(p.text.length, firstPos + query.length + 55);
                    let ctx = p.text.substring(start, end).trim();
                    if (start > 0) ctx = '...' + ctx;
                    if (end < p.text.length) ctx += '...';
                    
                    results.push({
                        page: p.page,
                        count: Math.ceil(count / 2),
                        ctx,
                        positions,
                        searchTerm: query,
                        id: `result-${p.page}-${Date.now()}`
                    });
                }
            });
            
            results.sort((a, b) => b.count - a.count);
            showResults(query);
            updateMiniNav();
            
            if (results.length > 0) {
                resultIdx = 0;
                gotoResult(0);
                showToast(`✅ ${results.length} نتيجة`, 'success');
            } else {
                showToast(`😕 لا توجد نتائج`, 'warning');
            }
        }
        
        function clearHighlights() {
            highlightElements.forEach(el => el.remove());
            highlightElements = [];
            
            document.querySelectorAll('.search-highlight').forEach(el => el.remove());
        }

        // ========== Highlighting ==========
        async function highlightTextOnPage(pageNum, searchTerm) {
            // Ensure page is rendered
            if (!renderedPages.has(pageNum)) {
                await renderPage(pageNum);
            }
            
            const highlightLayer = document.getElementById(`highlight-layer-${pageNum}`);
            if (!highlightLayer) return [];
            
            const items = pageTextItems[pageNum];
            if (!items) return [];
            
            const highlights = [];
            const searchLower = searchTerm.toLowerCase();
            const searchNoSpaces = searchTerm.replace(/\s/g, '').toLowerCase();
            
            // Build full text with positions
            let fullText = '';
            let charMap = []; // Maps character index to item
            
            items.forEach((item, itemIdx) => {
                for (let i = 0; i < item.str.length; i++) {
                    charMap.push({ itemIdx, charIdx: i });
                }
                fullText += item.str;
            });
            
            const fullTextLower = fullText.toLowerCase();
            const fullTextNoSpaces = fullText.replace(/\s/g, '').toLowerCase();
            
            // Find matches
            let idx = 0;
            while ((idx = fullTextLower.indexOf(searchLower, idx)) !== -1) {
                // Get items that contain this match
                const startMap = charMap[idx];
                const endMap = charMap[Math.min(idx + searchTerm.length - 1, charMap.length - 1)];
                
                if (startMap && endMap) {
                    // Create highlight for each item in range
                    for (let i = startMap.itemIdx; i <= endMap.itemIdx; i++) {
                        const item = items[i];
                        if (item) {
                            const highlight = document.createElement('div');
                            highlight.className = 'search-highlight';
                            highlight.style.left = `${item.left}px`;
                            highlight.style.top = `${item.top}px`;
                            highlight.style.width = `${item.width}px`;
                            highlight.style.height = `${item.height}px`;
                            
                            highlightLayer.appendChild(highlight);
                            highlights.push(highlight);
                            highlightElements.push(highlight);
                        }
                    }
                }
                idx++;
            }
            
            return highlights;
        }
        
        async function scrollToHighlight(pageNum, highlightIndex = 0) {
            const container = document.getElementById('pdfContainer');
            const pageWrapper = document.getElementById(`page-wrapper-${pageNum}`);
            
            if (!pageWrapper) {
                await renderPage(pageNum);
            }
            
            const wrapper = document.getElementById(`page-wrapper-${pageNum}`);
            if (!wrapper) return;
            
            // Get highlights on this page
            const highlights = wrapper.querySelectorAll('.search-highlight');
            
            if (highlights.length > 0) {
                // Mark active highlight
                highlights.forEach((h, i) => {
                    h.classList.toggle('active', i === highlightIndex);
                });
                
                const activeHighlight = highlights[highlightIndex] || highlights[0];
                
                // Calculate scroll position
                const wrapperRect = wrapper.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                const highlightRect = activeHighlight.getBoundingClientRect();
                
                // Scroll to show the highlight in the center of the viewport
                const scrollTop = wrapper.offsetTop + activeHighlight.offsetTop - (container.clientHeight / 2) + (activeHighlight.offsetHeight / 2);
                
                container.scrollTo({
                    top: Math.max(0, scrollTop),
                    behavior: 'smooth'
                });
            } else {
                // Just scroll to page
                wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // ========== Results Display ==========
        function showResults(query) {
            const list = document.getElementById('resultsList');
            const countEl = document.getElementById('resultsCount');
            const posEl = document.getElementById('resultPos');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            if (results.length === 0) {
                countEl.style.display = 'none';
                posEl.textContent = '-';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                list.innerHTML = `
                    <div class="placeholder">
                        <div class="placeholder-icon">😕</div>
                        <p>لا توجد نتائج لـ<br>"${query}"</p>
                    </div>
                `;
                return;
            }
            
            const total = results.reduce((s, r) => s + r.count, 0);
            countEl.textContent = total;
            countEl.style.display = 'inline';
            posEl.textContent = `1/${results.length}`;
            prevBtn.disabled = true;
            nextBtn.disabled = results.length <= 1;
            
            const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escaped})`, 'gi');
            
            list.innerHTML = results.map((r, i) => {
                const isPinned = pinnedResults.some(p => p.page === r.page && p.searchTerm === r.searchTerm);
                return `
                <div class="result-card ${i === 0 ? 'active' : ''} ${isPinned ? 'pinned' : ''}" 
                     data-index="${i}" onclick="gotoResult(${i})">
                    <div class="result-top">
                        <span class="page-badge">📄 صفحة ${r.page}</span>
                        <div class="result-actions">
                            <button class="result-action-btn copy-btn" 
                                    onclick="event.stopPropagation(); copyResult(${i})" title="نسخ">📋</button>
                            <button class="result-action-btn pin-btn ${isPinned ? 'pinned' : ''}" 
                                    onclick="event.stopPropagation(); togglePin(${i})" title="تثبيت">📌</button>
                            <button class="result-action-btn delete-btn" 
                                    onclick="event.stopPropagation(); deleteResult(${i})" title="حذف">✕</button>
                        </div>
                    </div>
                    <div class="result-text">${r.ctx.replace(regex, '<span class="hl">$1</span>')}</div>
                    <div class="result-buttons">
                        <button class="go-btn" onclick="event.stopPropagation(); gotoResult(${i})">
                            ← انتقال وتظليل
                        </button>
                        <button class="copy-result-btn" onclick="event.stopPropagation(); copyResult(${i})">
                            📋 نسخ
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        // ========== Navigation ==========
        async function gotoResult(i) {
            if (i < 0 || i >= results.length) return;
            resultIdx = i;
            
            // Update UI
            document.querySelectorAll('.result-card').forEach((c, j) => {
                c.classList.toggle('active', j === i);
            });
            
            document.getElementById('resultPos').textContent = `${i + 1}/${results.length}`;
            document.getElementById('prevBtn').disabled = i === 0;
            document.getElementById('nextBtn').disabled = i === results.length - 1;
            
            updateMiniNav();
            
            const result = results[i];
            const pageNum = result.page;
            
            // Clear previous highlights
            clearHighlights();
            
            // Highlight on all result pages
            for (let r of results) {
                await highlightTextOnPage(r.page, currentSearchTerm);
            }
            
            // Scroll to specific result
            await scrollToHighlight(pageNum);
            
            // Update page input
            document.getElementById('pageInput').value = pageNum;
            currentPage = pageNum;
            
            showToast(`📄 صفحة ${pageNum}`, 'success');
            
            // Scroll result card into view
            const card = document.querySelector('.result-card.active');
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        
        function navResult(dir) {
            const n = resultIdx + dir;
            if (n >= 0 && n < results.length) gotoResult(n);
        }
        
        function updateMiniNav() {
            const miniNav = document.getElementById('miniNav');
            const miniCurrentPos = document.getElementById('miniCurrentPos');
            const miniTotalResults = document.getElementById('miniTotalResults');
            const miniPrevBtn = document.getElementById('miniPrevBtn');
            const miniNextBtn = document.getElementById('miniNextBtn');
            
            if (results.length === 0) {
                miniNav.classList.add('hidden');
                return;
            }
            
            miniNav.classList.remove('hidden');
            miniCurrentPos.textContent = resultIdx + 1;
            miniTotalResults.textContent = results.length;
            miniPrevBtn.disabled = resultIdx <= 0;
            miniNextBtn.disabled = resultIdx >= results.length - 1;
        }

        // ========== Page Navigation ==========
        function goToPage(pageNum) {
            pageNum = parseInt(pageNum);
            if (pageNum < 1 || pageNum > totalPages || isNaN(pageNum)) {
                document.getElementById('pageInput').value = currentPage;
                return;
            }
            
            currentPage = pageNum;
            const wrapper = document.getElementById(`page-wrapper-${pageNum}`);
            
            if (wrapper) {
                wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
                renderPage(pageNum).then(() => {
                    const w = document.getElementById(`page-wrapper-${pageNum}`);
                    if (w) w.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            }
        }
        
        function goToPrevPage() {
            if (currentPage > 1) goToPage(currentPage - 1);
        }
        
        function goToNextPage() {
            if (currentPage < totalPages) goToPage(currentPage + 1);
        }

        // ========== Zoom ==========
        async function setScale(newScale) {
            currentScale = Math.max(CONFIG.MIN_SCALE, Math.min(CONFIG.MAX_SCALE, newScale));
            document.getElementById('zoomLevel').textContent = Math.round(currentScale * 100) + '%';
            
            // Re-render all visible pages
            renderedPages.clear();
            document.getElementById('pdfContainer').innerHTML = '';
            pageTextItems = [];
            
            await renderVisiblePages();
            
            // Re-apply highlights if searching
            if (currentSearchTerm && results.length > 0) {
                for (let r of results) {
                    await highlightTextOnPage(r.page, currentSearchTerm);
                }
            }
        }
        
        function zoomIn() { setScale(currentScale + CONFIG.SCALE_STEP); }
        function zoomOut() { setScale(currentScale - CONFIG.SCALE_STEP); }
        function fitWidth() {
            const container = document.getElementById('pdfContainer');
            const newScale = (container.clientWidth - 60) / 595; // A4 width
            setScale(newScale);
        }

        // ========== Download ==========
        function downloadPDF() {
            const link = document.createElement('a');
            link.href = CONFIG.PDF_FILE;
            link.download = CONFIG.PDF_FILE;
            link.click();
            showToast('⬇️ جاري التحميل...', 'info');
        }

        // ========== Copy Result ==========
        function copyResult(index) {
            if (index < 0 || index >= results.length) return;
            const result = results[index];
            const text = `صفحة ${result.page}: ${result.ctx.replace(/\.\.\./g, '')}`;
            
            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 تم نسخ النتيجة', 'success');
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('📋 تم نسخ النتيجة', 'success');
            });
        }

        // ========== Pin Functions ==========
        function togglePin(index) {
            const result = results[index];
            if (!result) return;
            
            const existingIndex = pinnedResults.findIndex(p => 
                p.page === result.page && p.searchTerm === result.searchTerm
            );
            
            if (existingIndex >= 0) {
                pinnedResults.splice(existingIndex, 1);
                showToast('📌 تم إلغاء التثبيت', 'info');
            } else {
                pinnedResults.push({...result, pinnedAt: Date.now()});
                showToast('📌 تم التثبيت', 'success');
            }
            
            savePinnedResults();
            updatePinnedSection();
            showResults(currentSearchTerm);
        }
        
        function deleteResult(index) {
            if (index < 0 || index >= results.length) return;
            results.splice(index, 1);
            
            if (results.length === 0) {
                clearSearchResults();
            } else {
                if (resultIdx >= results.length) resultIdx = results.length - 1;
                showResults(currentSearchTerm);
                updateMiniNav();
            }
            showToast('🗑️ تم الحذف', 'info');
        }
        
        function clearSearchResults() {
            results = [];
            resultIdx = -1;
            clearHighlights();
            document.getElementById('resultsCount').style.display = 'none';
            document.getElementById('resultPos').textContent = '-';
            document.getElementById('prevBtn').disabled = true;
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('resultsList').innerHTML = `
                <div class="placeholder">
                    <div class="placeholder-icon">🔍</div>
                    <p>اكتب في مربع البحث<br>للعثور على الأكواد</p>
                </div>
            `;
            updateMiniNav();
        }
        
        function clearAllResults() {
            clearSearchResults();
            document.getElementById('searchInput').value = '';
            currentSearchTerm = '';
            showToast('🗑️ تم مسح الكل', 'info');
        }
        
        function clearPinned() {
            pinnedResults = [];
            savePinnedResults();
            updatePinnedSection();
            showResults(currentSearchTerm);
            showToast('📌 تم مسح المثبتات', 'info');
        }
        
        function updatePinnedSection() {
            const section = document.getElementById('pinnedSection');
            const list = document.getElementById('pinnedList');
            
            if (pinnedResults.length === 0) {
                section.classList.remove('has-items');
                return;
            }
            
            section.classList.add('has-items');
            list.innerHTML = pinnedResults.map((r, i) => `
                <div class="result-card pinned" onclick="gotoPinnedResult(${i})" style="margin-bottom: 6px; padding: 10px;">
                    <div class="result-top" style="margin-bottom: 4px;">
                        <span class="page-badge">📄 ${r.page}</span>
                        <div class="result-actions">
                            <button class="result-action-btn copy-btn" 
                                    onclick="event.stopPropagation(); copyPinnedResult(${i})">📋</button>
                            <button class="result-action-btn delete-btn" 
                                    onclick="event.stopPropagation(); removePinned(${i})">✕</button>
                        </div>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text3);">"${r.searchTerm}"</div>
                </div>
            `).join('');
        }
        
        async function gotoPinnedResult(index) {
            const result = pinnedResults[index];
            if (!result) return;
            
            clearHighlights();
            await highlightTextOnPage(result.page, result.searchTerm);
            await scrollToHighlight(result.page);
            
            document.getElementById('pageInput').value = result.page;
            currentPage = result.page;
            
            showToast(`📌 صفحة ${result.page}`, 'success');
        }
        
        function copyPinnedResult(index) {
            if (index < 0 || index >= pinnedResults.length) return;
            const r = pinnedResults[index];
            navigator.clipboard.writeText(`صفحة ${r.page}: ${r.ctx}`).then(() => {
                showToast('📋 تم النسخ', 'success');
            });
        }
        
        function removePinned(index) {
            pinnedResults.splice(index, 1);
            savePinnedResults();
            updatePinnedSection();
            showResults(currentSearchTerm);
            showToast('📌 تم الإزالة', 'info');
        }
        
        function savePinnedResults() {
            localStorage.setItem('hs-code-pinned', JSON.stringify(pinnedResults));
        }
        
        function loadPinnedResults() {
            try {
                const saved = localStorage.getItem('hs-code-pinned');
                if (saved) {
                    pinnedResults = JSON.parse(saved);
                    updatePinnedSection();
                }
            } catch (e) {
                pinnedResults = [];
            }
        }
        
        function exportResults() {
            if (results.length === 0 && pinnedResults.length === 0) {
                showToast('⚠️ لا توجد نتائج', 'warning');
                return;
            }
            
            let text = `نتائج البحث - HS Code 2026\n${'='.repeat(40)}\n\n`;
            
            if (pinnedResults.length > 0) {
                text += `📌 المثبتة (${pinnedResults.length}):\n`;
                pinnedResults.forEach((r, i) => {
                    text += `${i + 1}. صفحة ${r.page} - "${r.searchTerm}"\n`;
                });
                text += '\n';
            }
            
            if (results.length > 0) {
                text += `🔍 "${currentSearchTerm}" (${results.length}):\n`;
                results.forEach((r, i) => {
                    text += `${i + 1}. صفحة ${r.page}: ${r.ctx}\n`;
                });
            }
            
            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 تم نسخ الكل', 'success');
            });
        }

        // ========== Toast ==========
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `show ${type}`;
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => toast.className = '', 3000);
        }

        // ========== Globals ==========
        window.gotoResult = gotoResult;
        window.navResult = navResult;
        window.copyResult = copyResult;
        window.togglePin = togglePin;
        window.deleteResult = deleteResult;
        window.clearAllResults = clearAllResults;
        window.clearPinned = clearPinned;
        window.gotoPinnedResult = gotoPinnedResult;
        window.copyPinnedResult = copyPinnedResult;
        window.removePinned = removePinned;
        window.exportResults = exportResults;
        window.toggleTheme = toggleTheme;
        window.togglePanel = togglePanel;
        window.goToPage = goToPage;
        window.goToPrevPage = goToPrevPage;
        window.goToNextPage = goToNextPage;
        window.zoomIn = zoomIn;
        window.zoomOut = zoomOut;
        window.fitWidth = fitWidth;
        window.downloadPDF = downloadPDF;
    </script>
</body>
</html>
