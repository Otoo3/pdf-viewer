<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 HS Code 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://acrobatservices.adobe.com/view-sdk/viewer.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --bg: #0a0a12;
            --surface: #13131f;
            --surface2: #1e1e30;
            --text: #f1f5f9;
            --text2: #94a3b8;
            --border: #2a2a42;
            --highlight: #fbbf24;
        }
        [data-theme="light"] {
            --bg: #f1f5f9; --surface: #fff; --surface2: #e2e8f0;
            --text: #1e293b; --text2: #64748b; --border: #cbd5e1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); }
        .app { display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
        }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo span { font-size: 2rem; }
        .logo h1 { font-size: 1.3rem; color: var(--primary); }
        .header-btns { display: flex; gap: 8px; }
        .icon-btn {
            width: 40px; height: 40px; border: none; border-radius: 10px;
            background: var(--surface2); color: var(--text); font-size: 1.2rem; cursor: pointer;
        }
        .icon-btn:hover { background: var(--primary); }
        
        /* Search Section */
        .search-section {
            padding: 15px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
        }
        .search-row { display: flex; gap: 10px; max-width: 700px; margin: 0 auto; align-items: center; }
        #searchInput {
            flex: 1; padding: 12px 18px; background: var(--surface2); border: 2px solid var(--border);
            border-radius: 12px; color: var(--text); font-size: 1rem; font-family: inherit;
        }
        #searchInput:focus { outline: none; border-color: var(--primary); }
        #searchInput:disabled { opacity: 0.5; }
        #searchBtn, #activateBtn {
            padding: 12px 24px; border: none; border-radius: 12px;
            font-size: 1rem; font-family: inherit; font-weight: 600; cursor: pointer;
        }
        #searchBtn { background: var(--primary); color: #fff; display: none; }
        #activateBtn { background: var(--success); color: #fff; }
        #activateBtn:hover, #searchBtn:hover { filter: brightness(1.1); }
        
        #status {
            text-align: center; margin-top: 10px; font-size: 0.85rem; color: var(--text2);
        }
        #status.loading { color: var(--warning); }
        #status.ready { color: var(--success); }
        
        /* Main */
        .main { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar */
        .sidebar {
            width: 350px; background: var(--surface); border-left: 1px solid var(--border);
            display: flex; flex-direction: column;
        }
        .sidebar-header {
            padding: 12px 15px; background: var(--surface2);
            display: flex; justify-content: space-between; align-items: center;
        }
        .sidebar-header h3 { font-size: 0.95rem; }
        #resultsCount { padding: 2px 10px; background: var(--primary); border-radius: 10px; font-size: 0.75rem; }
        
        .nav-row { display: flex; gap: 8px; padding: 10px 15px; border-bottom: 1px solid var(--border); }
        .nav-btn {
            flex: 1; padding: 8px; background: var(--surface2); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); cursor: pointer; font-family: inherit;
        }
        .nav-btn:hover:not(:disabled) { background: var(--primary); }
        .nav-btn:disabled { opacity: 0.4; }
        #resultPos { padding: 8px 12px; background: var(--bg); border-radius: 8px; text-align: center; }
        
        #resultsList { flex: 1; overflow-y: auto; padding: 12px; }
        .empty { text-align: center; padding: 40px 15px; color: var(--text2); }
        .empty span { font-size: 3rem; display: block; margin-bottom: 10px; opacity: 0.4; }
        
        .result-card {
            background: var(--surface2); border: 2px solid var(--border); border-radius: 12px;
            padding: 12px; margin-bottom: 10px; cursor: pointer;
        }
        .result-card:hover { border-color: var(--primary); }
        .result-card.active { border-color: var(--primary); background: rgba(99,102,241,0.1); }
        .result-top { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .page-badge { padding: 4px 12px; background: var(--primary); border-radius: 12px; font-size: 0.8rem; }
        .result-text {
            font-size: 0.85rem; color: var(--text2); line-height: 1.6;
            padding: 10px; background: var(--bg); border-radius: 8px; max-height: 65px; overflow: hidden;
        }
        .result-text mark { background: var(--highlight); color: #000; padding: 1px 3px; border-radius: 2px; }
        .go-btn {
            display: block; width: 100%; margin-top: 10px; padding: 10px;
            background: var(--primary); border: none; border-radius: 8px;
            color: #fff; font-family: inherit; font-weight: 600; cursor: pointer;
        }
        
        /* PDF */
        .pdf-area { flex: 1; background: #1a1a1a; }
        #pdf-container { width: 100%; height: 100%; }
        
        /* Page Indicator */
        #pageIndicator {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 30px; background: var(--primary); border-radius: 15px;
            font-size: 1.2rem; font-weight: 700; color: #fff; z-index: 1000;
            opacity: 0; transition: opacity 0.3s;
        }
        #pageIndicator.show { opacity: 1; }
        
        /* Responsive */
        @media (max-width: 800px) {
            .main { flex-direction: column-reverse; }
            .sidebar { width: 100%; max-height: 40vh; border-left: none; border-top: 1px solid var(--border); }
            .search-row { flex-wrap: wrap; }
            #searchInput { width: 100%; }
            #searchBtn, #activateBtn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">
                <span>📚</span>
                <h1>HS Code 2026</h1>
            </div>
            <div class="header-btns">
                <button id="themeBtn" class="icon-btn">🌙</button>
            </div>
        </header>

        <div class="search-section">
            <div class="search-row">
                <input type="text" id="searchInput" placeholder="🔍 ابحث عن كود أو منتج..." disabled>
                <button id="activateBtn">🚀 تفعيل البحث</button>
                <button id="searchBtn">بحث</button>
            </div>
            <div id="status">اضغط "تفعيل البحث" لتشغيل محرك البحث</div>
        </div>

        <div class="main">
            <main class="pdf-area">
                <div id="pdf-container"></div>
            </main>

            <aside class="sidebar">
                <div class="sidebar-header">
                    <h3>📊 النتائج <span id="resultsCount" style="display:none">0</span></h3>
                </div>
                <div class="nav-row">
                    <button id="prevBtn" class="nav-btn" disabled>▲</button>
                    <span id="resultPos">-</span>
                    <button id="nextBtn" class="nav-btn" disabled>▼</button>
                </div>
                <div id="resultsList">
                    <div class="empty">
                        <span>🔍</span>
                        <p>فعّل البحث ثم اكتب للبحث</p>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <div id="pageIndicator"></div>

    <script>
        // Config
        const CLIENT_ID = '5edf16250afa446aa490af6313d351b2';
        const PDF_FILE = 'HS Code 2026.pdf';
        
        // State
        let pdfData = [];
        let results = [];
        let resultIdx = -1;
        let isReady = false;
        
        // Load Adobe Viewer immediately
        if (window.AdobeDC) {
            loadViewer();
        } else {
            document.addEventListener('adobe_dc_view_sdk.ready', loadViewer);
        }
        
        function loadViewer() {
            new AdobeDC.View({ clientId: CLIENT_ID, divId: 'pdf-container' })
                .previewFile(
                    { content: { location: { url: PDF_FILE } }, metaData: { fileName: PDF_FILE } },
                    { embedMode: 'FULL_WINDOW', defaultViewMode: 'FIT_WIDTH', showDownloadPDF: true, showLeftHandPanel: true }
                )
                .then(v => { window.pdfAPIs = v.getAPIs ? v.getAPIs() : null; });
        }
        
        // Events
        document.getElementById('activateBtn').onclick = activateSearch;
        document.getElementById('searchBtn').onclick = doSearch;
        document.getElementById('searchInput').onkeydown = e => { if (e.key === 'Enter' && isReady) doSearch(); };
        document.getElementById('searchInput').oninput = function() {
            clearTimeout(window.t);
            if (this.value.length >= 2 && isReady) window.t = setTimeout(doSearch, 400);
        };
        document.getElementById('prevBtn').onclick = () => nav(-1);
        document.getElementById('nextBtn').onclick = () => nav(1);
        document.getElementById('themeBtn').onclick = toggleTheme;
        
        // Activate Search (loads PDF.js on demand)
        async function activateSearch() {
            const btn = document.getElementById('activateBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.textContent = '⏳ جاري التحميل...';
            status.textContent = 'جاري تحميل محرك البحث...';
            status.className = 'loading';
            
            // Load PDF.js dynamically
            await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            
            try {
                status.textContent = 'جاري فتح الملف...';
                const pdf = await pdfjsLib.getDocument({ url: PDF_FILE, cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/', cMapPacked: true }).promise;
                const total = pdf.numPages;
                pdfData = [];
                
                for (let i = 1; i <= total; i++) {
                    status.textContent = `فهرسة ${i}/${total}...`;
                    try {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        const text = content.items.map(x => x.str).join(' ');
                        pdfData.push({ page: i, text: norm(text), orig: text });
                    } catch(e) {
                        pdfData.push({ page: i, text: '', orig: '' });
                    }
                    if (i % 10 === 0) await new Promise(r => setTimeout(r, 10));
                }
                
                isReady = true;
                btn.style.display = 'none';
                document.getElementById('searchBtn').style.display = 'block';
                document.getElementById('searchInput').disabled = false;
                document.getElementById('searchInput').focus();
                status.textContent = `✅ جاهز (${total} صفحة)`;
                status.className = 'ready';
                setTimeout(() => status.style.display = 'none', 3000);
                
            } catch(e) {
                status.textContent = '❌ خطأ: ' + e.message;
                btn.disabled = false;
                btn.textContent = '🚀 تفعيل البحث';
            }
        }
        
        function loadScript(src) {
            return new Promise((res, rej) => {
                if (document.querySelector(`script[src="${src}"]`)) return res();
                const s = document.createElement('script');
                s.src = src; s.onload = res; s.onerror = rej;
                document.head.appendChild(s);
            });
        }
        
        function norm(t) {
            return t.replace(/\s+/g, ' ').replace(/[أإآا]/g, 'ا').replace(/[ىي]/g, 'ي').replace(/ة/g, 'ه').trim();
        }
        
        // Search
        function doSearch() {
            const q = document.getElementById('searchInput').value.trim();
            if (!q || !isReady) return;
            
            const qn = norm(q).toLowerCase();
            results = [];
            
            pdfData.forEach(p => {
                if (!p.text) return;
                const t = p.text.toLowerCase();
                let c = 0, i = 0;
                while ((i = t.indexOf(qn, i)) !== -1) { c++; i++; }
                if (c > 0) {
                    const idx = t.indexOf(qn);
                    let ctx = p.orig.substring(Math.max(0, idx - 40), Math.min(p.orig.length, idx + q.length + 60));
                    if (idx > 40) ctx = '...' + ctx;
                    if (idx + q.length + 60 < p.orig.length) ctx += '...';
                    results.push({ page: p.page, count: c, ctx });
                }
            });
            
            results.sort((a, b) => b.count - a.count);
            showResults(q);
            if (results.length > 0) { resultIdx = 0; goTo(0); }
        }
        
        function showResults(q) {
            const list = document.getElementById('resultsList');
            const cnt = document.getElementById('resultsCount');
            
            if (results.length === 0) {
                cnt.style.display = 'none';
                document.getElementById('resultPos').textContent = '-';
                document.getElementById('prevBtn').disabled = document.getElementById('nextBtn').disabled = true;
                list.innerHTML = `<div class="empty"><span>😕</span><p>لا نتائج لـ "${q}"</p></div>`;
                return;
            }
            
            cnt.textContent = results.length;
            cnt.style.display = 'inline';
            document.getElementById('resultPos').textContent = `1/${results.length}`;
            document.getElementById('prevBtn').disabled = true;
            document.getElementById('nextBtn').disabled = results.length <= 1;
            
            const rx = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            list.innerHTML = results.map((r, i) => `
                <div class="result-card ${i === 0 ? 'active' : ''}" onclick="goTo(${i})">
                    <div class="result-top">
                        <span class="page-badge">📄 صفحة ${r.page}</span>
                        <span style="font-size:0.75rem;color:var(--text2)">${r.count} تطابق</span>
                    </div>
                    <div class="result-text">${r.ctx.replace(rx, '<mark>$1</mark>')}</div>
                    <button class="go-btn" onclick="event.stopPropagation();goTo(${i})">← انتقال</button>
                </div>
            `).join('');
        }
        
        async function goTo(i) {
            if (i < 0 || i >= results.length) return;
            resultIdx = i;
            
            document.querySelectorAll('.result-card').forEach((c, j) => c.classList.toggle('active', j === i));
            document.getElementById('resultPos').textContent = `${i + 1}/${results.length}`;
            document.getElementById('prevBtn').disabled = i === 0;
            document.getElementById('nextBtn').disabled = i === results.length - 1;
            
            const page = results[i].page;
            const ind = document.getElementById('pageIndicator');
            ind.textContent = `📄 صفحة ${page}`;
            ind.classList.add('show');
            setTimeout(() => ind.classList.remove('show'), 1500);
            
            if (window.pdfAPIs) try { await window.pdfAPIs.gotoLocation(page); } catch(e) {}
            document.querySelector('.result-card.active')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        function nav(d) { const n = resultIdx + d; if (n >= 0 && n < results.length) goTo(n); }
        
        function toggleTheme() {
            const isLight = document.body.getAttribute('data-theme') === 'light';
            document.body.setAttribute('data-theme', isLight ? '' : 'light');
            document.getElementById('themeBtn').textContent = isLight ? '🌙' : '☀️';
        }
        
        window.goTo = goTo;
    </script>
</body>
</html>
